<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Quản lý danh mục – Medium</title>
<link rel="stylesheet" href="shared.css">
<style>
  .admin-main { padding: 24px 40px; }
  .admin-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
  }
  .admin-header h1 {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 32px;
    font-weight: 400;
  }
  .add-row {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
  }
  .add-row .form-control { max-width: 280px; }
  .cat-name-cell { font-weight: 600; }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <span class="hamburger" onclick="toggleSidebar()">&#9776;</span>
    <a href="index.html" class="logo">Medium</a>
    <div class="search-box">&#128269; <span>Search</span></div>
  </div>
  <div class="topbar-right">
    <div class="lang-dropdown">
      <button class="lang-btn" onclick="toggleLangMenu()">&#127760; <span class="lang-current-label">Tiếng Việt</span> &#9662;</button>
      <div class="lang-menu">
        <a href="#" data-lang="vi" onclick="selectLanguage('vi');return false;">Tiếng Việt</a>
        <a href="#" data-lang="en" onclick="selectLanguage('en');return false;">English</a>
      </div>
    </div>
    <button class="theme-toggle" onclick="toggleTheme()"><span class="knob">&#9728;</span></button>
    <span class="icon-btn">&#128276;</span>
    <div class="avatar" style="background:#5A3FBF;">A</div>
  </div>
</div>

<div class="layout no-rail" id="layoutRoot">
  <aside class="sidebar">
    <a href="admin-dashboard.html"><span class="icon">&#128202;</span> Dashboard</a>
    <a href="admin-users.html"><span class="icon">&#128101;</span> Manage users</a>
    <a href="admin-categories.html" class="active"><span class="icon">&#128193;</span> Manage categories</a>
    <a href="admin-languages.html"><span class="icon">&#127760;</span> Manage languages</a>
    <hr>
    <a href="index.html"><span class="icon">&#8962;</span> Về trang blog</a>
  </aside>

  <main class="admin-main">
    <div class="admin-header">
      <h1>Quản lý danh mục</h1>
    </div>

    <div class="add-row">
      <input type="text" class="form-control" id="newCatInput" placeholder="Tên danh mục mới...">
      <button class="btn btn-primary" onclick="addCategory()">+ Thêm danh mục</button>
    </div>

    <div class="card">
      <table class="data-table" id="catTable">
        <thead>
          <tr>
            <th>Danh mục</th>
            <th>Số bài viết</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td class="cat-name-cell">Programming</td>
            <td>84</td>
            <td>
              <div class="action-icons" style="display:flex; gap:12px;">
                <button onclick="renameCategory(this)" style="background:none;border:none;cursor:pointer;color:var(--text-muted);">&#9998;</button>
                <button onclick="deleteCategory(this)" style="background:none;border:none;cursor:pointer;color:var(--text-muted);">&#128465;</button>
              </div>
            </td>
          </tr>
          <tr>
            <td class="cat-name-cell">Design (UX/UI)</td>
            <td>52</td>
            <td>
              <div class="action-icons" style="display:flex; gap:12px;">
                <button onclick="renameCategory(this)" style="background:none;border:none;cursor:pointer;color:var(--text-muted);">&#9998;</button>
                <button onclick="deleteCategory(this)" style="background:none;border:none;cursor:pointer;color:var(--text-muted);">&#128465;</button>
              </div>
            </td>
          </tr>
          <tr>
            <td class="cat-name-cell">Sports</td>
            <td>63</td>
            <td>
              <div class="action-icons" style="display:flex; gap:12px;">
                <button onclick="renameCategory(this)" style="background:none;border:none;cursor:pointer;color:var(--text-muted);">&#9998;</button>
                <button onclick="deleteCategory(this)" style="background:none;border:none;cursor:pointer;color:var(--text-muted);">&#128465;</button>
              </div>
            </td>
          </tr>
          <tr>
            <td class="cat-name-cell">Lifestyle</td>
            <td>41</td>
            <td>
              <div class="action-icons" style="display:flex; gap:12px;">
                <button onclick="renameCategory(this)" style="background:none;border:none;cursor:pointer;color:var(--text-muted);">&#9998;</button>
                <button onclick="deleteCategory(this)" style="background:none;border:none;cursor:pointer;color:var(--text-muted);">&#128465;</button>
              </div>
            </td>
          </tr>
          <tr>
            <td class="cat-name-cell">Health</td>
            <td>29</td>
            <td>
              <div class="action-icons" style="display:flex; gap:12px;">
                <button onclick="renameCategory(this)" style="background:none;border:none;cursor:pointer;color:var(--text-muted);">&#9998;</button>
                <button onclick="deleteCategory(this)" style="background:none;border:none;cursor:pointer;color:var(--text-muted);">&#128465;</button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

<script src="shared.js"></script>
<script>
  function addCategory() {
    const input = document.getElementById('newCatInput');
    const name = input.value.trim();
    if (!name) return;
    const tbody = document.querySelector('#catTable tbody');
    const row = document.createElement('tr');
    row.innerHTML = `
      <td class="cat-name-cell">${name}</td>
      <td>0</td>
      <td>
        <div class="action-icons" style="display:flex; gap:12px;">
          <button onclick="renameCategory(this)" style="background:none;border:none;cursor:pointer;color:var(--text-muted);">&#9998;</button>
          <button onclick="deleteCategory(this)" style="background:none;border:none;cursor:pointer;color:var(--text-muted);">&#128465;</button>
        </div>
      </td>`;
    tbody.appendChild(row);
    input.value = '';
  }
  function renameCategory(btn) {
    const cell = btn.closest('tr').querySelector('.cat-name-cell');
    const newName = prompt('Đổi tên danh mục:', cell.textContent);
    if (newName && newName.trim()) cell.textContent = newName.trim();
  }
  function deleteCategory(btn) {
    const row = btn.closest('tr');
    if (confirm('Xóa danh mục "' + row.querySelector('.cat-name-cell').textContent + '"?')) {
      row.remove();
    }
  }
</script>
</body>
</html>
