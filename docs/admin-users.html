<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Quản lý người dùng – Medium</title>
<link rel="stylesheet" href="shared.css">
<style>
  .admin-main { padding: 24px 40px; }
  .admin-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
  }
  .admin-header h1 {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 32px;
    font-weight: 400;
  }
  .filter-row {
    display: flex;
    gap: 12px;
    margin-bottom: 16px;
  }
  .filter-row .form-control { max-width: 220px; }
  .user-cell { display: flex; align-items: center; gap: 10px; }
  .user-cell .mini-avatar { width: 30px; height: 30px; border-radius: 50%; background:#999; }
  select.role-select {
    border: 1px solid var(--border-strong);
    border-radius: 6px;
    padding: 5px 10px;
    font-size: 13px;
    background: var(--card-bg);
    color: var(--text);
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <span class="hamburger" onclick="toggleSidebar()">&#9776;</span>
    <a href="index.html" class="logo">Medium</a>
    <div class="search-box">&#128269; <span>Search</span></div>
  </div>
  <div class="topbar-right">
    <div class="lang-dropdown">
      <button class="lang-btn" onclick="toggleLangMenu()">&#127760; <span class="lang-current-label">Tiếng Việt</span> &#9662;</button>
      <div class="lang-menu">
        <a href="#" data-lang="vi" onclick="selectLanguage('vi');return false;">Tiếng Việt</a>
        <a href="#" data-lang="en" onclick="selectLanguage('en');return false;">English</a>
      </div>
    </div>
    <button class="theme-toggle" onclick="toggleTheme()"><span class="knob">&#9728;</span></button>
    <span class="icon-btn">&#128276;</span>
    <div class="avatar" style="background:#5A3FBF;">A</div>
  </div>
</div>

<div class="layout no-rail" id="layoutRoot">
  <aside class="sidebar">
    <a href="admin-dashboard.html"><span class="icon">&#128202;</span> Dashboard</a>
    <a href="admin-users.html" class="active"><span class="icon">&#128101;</span> Manage users</a>
    <a href="admin-categories.html"><span class="icon">&#128193;</span> Manage categories</a>
    <a href="admin-languages.html"><span class="icon">&#127760;</span> Manage languages</a>
    <hr>
    <a href="index.html"><span class="icon">&#8962;</span> Về trang blog</a>
  </aside>

  <main class="admin-main">
    <div class="admin-header">
      <h1>Quản lý người dùng</h1>
      <button class="btn btn-primary" onclick="alert('Mở form mời người dùng mới')">+ Thêm người dùng</button>
    </div>

    <div class="filter-row">
      <input type="text" class="form-control" placeholder="Tìm theo tên hoặc email..." style="max-width:280px;">
      <select class="form-control">
        <option>Tất cả vai trò</option>
        <option>Super Admin</option>
        <option>Blog Owner</option>
        <option>Authenticated User</option>
      </select>
    </div>

    <div class="card">
      <table class="data-table">
        <thead>
          <tr>
            <th>Người dùng</th>
            <th>Email</th>
            <th>Vai trò</th>
            <th>Trạng thái</th>
            <th>Ngày tham gia</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="users-tbody">
          <!-- Rendered by js -->
        </tbody>
      </table>
    </div>
  </main>
</div>

<script src="shared.js"></script>
<script src="js/mockData.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const user = db.getCurrentUser();
    if (!user || user.role_id !== 1) {
      alert('Vui lòng đăng nhập với tài khoản Super Admin!');
      window.location.href = 'login.html';
      return;
    }

    renderUsers();
  });

  function renderUsers() {
    const users = db.get('users');
    const roles = db.get('roles');
    
    let html = '';
    users.forEach(u => {
      const dateStr = new Date(u.created_at).toLocaleDateString();
      const statusBadge = u.is_active 
        ? '<span class="badge badge-green">Hoạt động</span>' 
        : '<span class="badge badge-red">Đã khóa</span>';
        
      const actionBtn = u.is_active
        ? `<button class="btn btn-sm btn-danger" onclick="toggleStatus(${u.id}, false)">Khóa</button>`
        : `<button class="btn btn-sm btn-outline" onclick="toggleStatus(${u.id}, true)">Mở khóa</button>`;

      const roleOptions = roles.map(r => 
        `<option value="${r.id}" ${u.role_id === r.id ? 'selected' : ''}>${r.name_role}</option>`
      ).join('');

      html += `
        <tr>
          <td class="user-cell"><span class="mini-avatar"></span> ${u.full_name || u.user_name}</td>
          <td>${u.email}</td>
          <td>
            <select class="role-select" onchange="changeRole(${u.id}, this.value)">
              ${roleOptions}
            </select>
          </td>
          <td>${statusBadge}</td>
          <td>${dateStr}</td>
          <td>${actionBtn}</td>
        </tr>
      `;
    });
    
    document.getElementById('users-tbody').innerHTML = html;
  }

  function toggleStatus(userId, isActive) {
    const users = db.get('users');
    const userIndex = users.findIndex(u => u.id === userId);
    if (userIndex > -1) {
      users[userIndex].is_active = isActive;
      db.set('users', users);
      renderUsers();
    }
  }

  function changeRole(userId, newRoleId) {
    const users = db.get('users');
    const userIndex = users.findIndex(u => u.id === userId);
    if (userIndex > -1) {
      users[userIndex].role_id = parseInt(newRoleId);
      db.set('users', users);
      // alert('Đã cập nhật phân quyền!');
    }
  }
</script>
</body>
</html>
