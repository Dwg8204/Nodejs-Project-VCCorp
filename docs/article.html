<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>

<title>What good writing looks like</title>
<link rel="stylesheet" href="shared.css">
<style>
  .article-wrapper {
    max-width: 700px;
    margin: 0 auto;
    padding: 24px 20px 80px 20px;
  }
  .publication {
    font-family: inherit;
    font-weight: 700;
    font-size: 18px;
    padding: 16px 0;
    border-bottom: 1px solid var(--border);
    margin-bottom: 24px;
  }
  .member-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: 1px solid #FFC017;
    color: #8a6d00;
    background: #FFF9E8;
    font-size: 13px;
    padding: 4px 12px;
    border-radius: 14px;
    margin-bottom: 20px;
  }
  [data-theme="dark"] .member-badge {
    border-color: #B8891A;
    color: #F2C94C;
    background: rgba(255, 192, 23, 0.12);
  }
  h1.title {
    font-family: inherit;
    font-size: 42px;
    line-height: 1.2;
    margin-bottom: 16px;
  }
  .subtitle {
    font-size: 20px;
    color: var(--text-muted);
    margin-bottom: 24px;
  }
  .byline {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 24px;
  }
  .byline .author-avatar {
    width: 40px; height: 40px; border-radius: 50%;
    background: #A87A50;
  }
  .byline .author-name { font-weight: 600; font-size: 15px; }
  .byline .follow-btn {
    border: 1px solid var(--text);
    border-radius: 16px;
    padding: 4px 14px;
    font-size: 13px;
    font-weight: 600;
    background: none;
    cursor: pointer;
  }
  .byline .meta {
    font-size: 13px;
    color: var(--text-muted);
  }
  .toolbar {
    display: flex;
    align-items: center;
    gap: 24px;
    padding: 12px 0;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    margin-bottom: 32px;
    color: var(--text-muted);
    font-size: 15px;
  }
  .toolbar .spacer { flex: 1; }

  .hero-image {
    width: 100%;
    border-radius: 4px;
    margin-bottom: 24px;
    background-size: cover;
    background-position: center;
    height: 380px;
  }
  .body-text {
    font-size: 20px;
    line-height: 1.7;
    color: var(--text);
  }
  .body-text p { margin-bottom: 24px; }

  /* Responses section */
  .responses-section {
    max-width: 700px;
    margin: 40px auto 0 auto;
    padding: 24px 20px 80px 20px;
  }
  .responses-title {
    font-family: inherit;
    font-size: 26px;
    margin-bottom: 24px;
  }
  .comment-input {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 32px;
  }
  .comment-input .author-avatar {
    width: 36px; height: 36px; border-radius: 50%; background:#7A5C42;
    color:var(--bg); display:flex; align-items:center; justify-content:center;
    font-size:13px; font-weight:600;
  }
  .comment-input .input-box {
    flex: 1;
    border: none;
    border-bottom: 1px solid var(--border-strong);
    padding: 8px 0;
    font-size: 16px;
    color: var(--text-muted);
  }
  .comment {
    display: flex;
    gap: 12px;
    padding: 20px 0;
    border-bottom: 1px solid var(--border);
  }
  .comment .author-avatar {
    width: 32px; height: 32px; border-radius: 50%; background: #555;
    flex-shrink: 0;
  }
  .comment-body { flex: 1; }
  .comment-header {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    margin-bottom: 6px;
  }
  .comment-header .name { font-weight: 600; }
  .comment-header .date { color: var(--text-muted); }
  .comment-text {
    font-size: 15px;
    color: var(--text);
    margin-bottom: 10px;
  }
  .comment-actions {
    display: flex;
    gap: 16px;
    font-size: 13px;
    color: var(--text-muted);
  }
</style>
</head>
<body>

<!-- ===== Topbar (kế thừa giống trang chủ) ===== -->
<div class="topbar">
  <div class="topbar-left">
    <span class="hamburger" onclick="toggleSidebar()"><iconify-icon icon="material-symbols:menu-rounded"></iconify-icon></span>
    <a href="index.html" class="logo">Medium</a>
    <div class="search-box"><iconify-icon icon="solar:magnifer-linear"></iconify-icon> <span>Search</span></div>
  </div>
  <div class="topbar-right">
    <div class="lang-dropdown">
      <button class="lang-btn" onclick="toggleLangMenu()"><iconify-icon icon="fa:language"></iconify-icon> <span class="lang-current-label">Tiếng Việt</span> <iconify-icon icon="solar:alt-arrow-down-linear"></iconify-icon></button>
      <div class="lang-menu">
        <a href="#" data-lang="vi" onclick="selectLanguage('vi');return false;">Tiếng Việt</a>
        <a href="#" data-lang="en" onclick="selectLanguage('en');return false;">English</a>
      </div>
    </div>
    <button class="theme-toggle" onclick="toggleTheme()"><span class="knob"><iconify-icon icon="solar:sun-bold"></iconify-icon></span></button>
    <div class="avatar">N</div>
  </div>
</div>

<div class="layout" id="layoutRoot">
  <!-- ===== Sidebar (kế thừa giống trang chủ) ===== -->
    <aside class="sidebar" id="mainSidebar">
    <a href="index.html"><span class="icon"><iconify-icon icon="material-symbols:home-rounded"></iconify-icon></span> Home</a>
    <a href="profile.html"><span class="icon"><iconify-icon icon="solar:user-bold"></iconify-icon></span> Profile</a>
  </aside>

  <!-- ===== Article content ===== -->
  <main style="grid-column: span 2;">
    <div class="article-wrapper" id="article-content-container">
      <!-- rendered by js -->
    </div>

    <!-- ===== Responses ===== -->
    <div class="responses-section">
      <div class="responses-title" id="responses-count-title">Responses (0)</div>

      <div class="guest-comment-notice" id="guest-comment-notice" style="display:none;">
        <iconify-icon icon="solar:lock-keyhole-bold-duotone" style="font-size:20px;"></iconify-icon>
        <span>Bạn cần <a href="login.html">đăng nhập</a> để thực hiện chức năng bình luận.</span>
      </div>

      <div class="comment-input" id="comment-input-area" style="display:none;">
        <div class="author-avatar" id="current-user-avatar">N</div>
        <textarea id="newCommentText" class="comment-textarea" rows="1" placeholder="What are your thoughts?" onkeydown="handleComment(event)" oninput="autoResizeTextarea(this)"></textarea>
      </div>

      <div id="comments-container">
        <!-- Rendered by js -->
      </div>
    </div>
  </main>
</div>

<script src="shared.js"></script>
<script src="js/mockData.js"></script>
<script>
  let currentPostId = null;

  document.addEventListener('DOMContentLoaded', () => {
    // Topbar Auth logic
    const currentUser = db.getCurrentUser();
    if (!currentUser) {
      const topbarRight = document.querySelector('.topbar-right');
      topbarRight.innerHTML = `
        <a href="login.html" style="margin-right:15px; color:var(--text-muted); text-decoration:none;">Sign In</a>
        <a href="register.html" style="background:var(--text); color:var(--bg); padding:8px 16px; border-radius:20px; text-decoration:none;">Get Started</a>
      `;
      document.getElementById('guest-comment-notice').style.display = 'flex';
    } else {
      document.getElementById('comment-input-area').style.display = 'flex';
      document.getElementById('current-user-avatar').textContent = (currentUser.full_name || currentUser.user_name || 'U').charAt(0).toUpperCase();
    }

    const params = new URLSearchParams(window.location.search);
    const idParam = params.get('id');
    const langId = localStorage.getItem('current_language_id') || '1';

    if (!idParam) {
      document.getElementById('article-content-container').innerHTML = '<p>Bài viết không tồn tại.</p>';
      return;
    }

    currentPostId = parseInt(idParam);
    const posts = db.getPostsWithDetails(langId);
    const post = posts.find(p => p.id === currentPostId);

    if (!post) {
      console.warn('Post not found for ID:', currentPostId);
      document.getElementById('article-content-container').innerHTML = '<p>Bài viết không tồn tại hoặc đã bị ẩn.</p>';
      return;
    }
    
    console.log('Successfully fetched post:', post);

    document.title = post.title;

    const imgUrl = `https://images.unsplash.com/photo-${1441974231531 + post.id}-c6227db76b6e?w=900`;

    document.getElementById('article-content-container').innerHTML = `
      <div class="publication">${post.category_name}</div>
      <h1 class="title">${post.title}</h1>
      <div class="byline">
        <a href="profile.html?id=${post.author_id}"><div class="author-avatar" data-fallback-bg="1" style="background-image:url('https://api.dicebear.com/7.x/avataaars/svg?seed=${post.author_name}'); background-size:cover;"></div></a>
        <div>
          <a href="profile.html?id=${post.author_id}" class="author-name" style="color:inherit;">${post.author_name}</a>
        </div>
        <button class="follow-btn">Follow</button>
        <div class="meta">${post.date_formatted}</div>
      </div>

      <div class="toolbar">
        <span class="like-btn ${isPostLiked(post.id) ? 'liked' : ''}" onclick="toggleLike(${post.id}, this)"><iconify-icon icon="solar:heart-bold-duotone"></iconify-icon> <span class="like-count">${post.likes}</span></span>
        <span class="comment-btn" onclick="focusCommentBox()"><iconify-icon icon="solar:chat-round-dots-bold-duotone"></iconify-icon> ${post.comments}</span>
        <span class="spacer"></span>
        <span class="bookmark-btn ${isPostBookmarked(post.id) ? 'active' : ''}" onclick="toggleBookmark(${post.id}, this)"><iconify-icon icon="solar:bookmark-bold-duotone"></iconify-icon></span>
        <span><iconify-icon icon="solar:menu-dots-bold"></iconify-icon></span>
      </div>

      <div class="hero-image" data-fallback-bg="1" style="background-image:url('${imgUrl}');"></div>

      <div class="body-text">
        ${post.content || '<p>Không có nội dung</p>'}
      </div>
    `;

    applyBgFallback();
    renderComments();
  });

  function renderComments() {
    const allComments = db.get('comments').filter(c => c.post_id === currentPostId);
    const users = db.get('users');

    document.getElementById('responses-count-title').textContent = `Responses (${allComments.length})`;

    const rootComments = allComments.filter(c => !c.parent_id);
    let html = '';

    function renderMentionContent(content) {
      const m = content.match(/^@@(.+?)@@ ([\s\S]*)$/);
      if (m) {
        return `<b style="color:var(--accent);">@${m[1]}</b> ${m[2]}`;
      }
      return content;
    }

    function buildCommentHTML(c, isChild) {
      const user = users.find(u => u.id === c.user_id);
      const name = user ? (user.full_name || user.user_name) : 'Anonymous';
      const initial = name.charAt(0).toUpperCase();
      const dateStr = new Date(c.created_at).toLocaleDateString();
      const margin = isChild ? 'margin-left: 44px; border-left: 2px solid var(--border); padding-left: 12px;' : '';
      const safeName = name.replace(/'/g, "\\'");

      let res = `
        <div class="comment" style="${margin}">
          <div class="author-avatar" style="color:var(--bg); display:flex; align-items:center; justify-content:center; font-size:12px;">${initial}</div>
          <div class="comment-body">
            <div class="comment-header">
              <span class="name">${name}</span>
              <span class="date">${dateStr}</span>
            </div>
            <div class="comment-text" style="white-space:pre-wrap; word-break:break-word;">${renderMentionContent(c.content)}</div>
            <div class="comment-actions">
              <span style="cursor:pointer; color: var(--text);" onclick="toggleReplyForm(${c.id}, '${safeName}')">Reply</span>
            </div>
            <div id="reply-form-${c.id}" data-reply-to="${name}" style="display:none; margin-top: 10px;">
              <div style="font-size:13px; color:var(--text-muted); margin-bottom:6px;">Đang trả lời <b style="color:var(--text);">${name}</b> <span style="cursor:pointer; margin-left:6px;" onclick="toggleReplyForm(${c.id}, '${safeName}')">&times;</span></div>
              <textarea class="comment-textarea" rows="1" placeholder="Viết phản hồi..." onkeydown="submitReply(event, ${c.id})" oninput="autoResizeTextarea(this)"></textarea>
            </div>
          </div>
        </div>
      `;
      // render children
      const children = allComments.filter(child => child.parent_id === c.id);
      children.forEach(child => {
        res += buildCommentHTML(child, true);
      });
      return res;
    }

    rootComments.forEach(c => {
      html += buildCommentHTML(c, false);
    });

    document.getElementById('comments-container').innerHTML = html;
  }

  function handleComment(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      submitReply(e, null);
    }
  }

  function toggleReplyForm(id, replyToName) {
    const form = document.getElementById('reply-form-' + id);
    form.style.display = form.style.display === 'none' ? 'block' : 'none';
    if(form.style.display === 'block') {
      form.querySelector('textarea').focus();
    }
  }

  function submitReply(e, parentId) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      let text = e.target.value.trim();
      if (!text) return;

      const user = db.getCurrentUser();
      if (!user) {
        alert('Bạn cần đăng nhập để bình luận!');
        return;
      }

      // Gắn tag tên người được reply vào đầu nội dung
      const formEl = e.target.closest('[data-reply-to]');
      if (formEl && formEl.dataset.replyTo) {
        text = `@@${formEl.dataset.replyTo}@@ ${text}`;
      }

      const comments = db.get('comments');
      const newId = comments.length ? Math.max(...comments.map(c => c.id)) + 1 : 1;
      
      comments.push({
        id: newId,
        post_id: currentPostId,
        user_id: user.id,
        parent_id: parentId,
        content: text,
        created_at: new Date().toISOString(),
        updated_at: new Date().toISOString()
      });
      db.set('comments', comments);
      
      e.target.value = '';
      e.target.style.height = 'auto';
      renderComments();
    }
  }
</script>
</body>
</html>
