<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>What good writing looks like</title>
<link rel="stylesheet" href="shared.css">
<style>
  .article-wrapper {
    max-width: 700px;
    margin: 0 auto;
    padding: 24px 20px 80px 20px;
  }
  .publication {
    font-family: Georgia, serif;
    font-weight: 700;
    font-size: 18px;
    padding: 16px 0;
    border-bottom: 1px solid #F2F2F2;
    margin-bottom: 24px;
  }
  .member-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: 1px solid #FFC017;
    color: #8a6d00;
    background: #FFF9E8;
    font-size: 13px;
    padding: 4px 12px;
    border-radius: 14px;
    margin-bottom: 20px;
  }
  h1.title {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 42px;
    line-height: 1.2;
    margin-bottom: 16px;
  }
  .subtitle {
    font-size: 20px;
    color: #6B6B6B;
    margin-bottom: 24px;
  }
  .byline {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 24px;
  }
  .byline .author-avatar {
    width: 40px; height: 40px; border-radius: 50%;
    background: #A87A50;
  }
  .byline .author-name { font-weight: 600; font-size: 15px; }
  .byline .follow-btn {
    border: 1px solid #242424;
    border-radius: 16px;
    padding: 4px 14px;
    font-size: 13px;
    font-weight: 600;
    background: none;
    cursor: pointer;
  }
  .byline .meta {
    font-size: 13px;
    color: #6B6B6B;
  }
  .toolbar {
    display: flex;
    align-items: center;
    gap: 24px;
    padding: 12px 0;
    border-top: 1px solid #F2F2F2;
    border-bottom: 1px solid #F2F2F2;
    margin-bottom: 32px;
    color: #6B6B6B;
    font-size: 15px;
  }
  .toolbar .spacer { flex: 1; }

  .hero-image {
    width: 100%;
    border-radius: 4px;
    margin-bottom: 24px;
    background-size: cover;
    background-position: center;
    height: 380px;
  }
  .body-text {
    font-size: 20px;
    line-height: 1.7;
    color: #242424;
  }
  .body-text p { margin-bottom: 24px; }

  /* Responses section */
  .responses-section {
    max-width: 700px;
    margin: 40px auto 0 auto;
    padding: 24px 20px 80px 20px;
  }
  .responses-title {
    font-family: Georgia, serif;
    font-size: 26px;
    margin-bottom: 24px;
  }
  .comment-input {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 32px;
  }
  .comment-input .author-avatar {
    width: 36px; height: 36px; border-radius: 50%; background:#7A5C42;
    color:#fff; display:flex; align-items:center; justify-content:center;
    font-size:13px; font-weight:600;
  }
  .comment-input .input-box {
    flex: 1;
    border: none;
    border-bottom: 1px solid #E5E5E5;
    padding: 8px 0;
    font-size: 16px;
    color: #6B6B6B;
  }
  .comment {
    display: flex;
    gap: 12px;
    padding: 20px 0;
    border-bottom: 1px solid #F2F2F2;
  }
  .comment .author-avatar {
    width: 32px; height: 32px; border-radius: 50%; background: #555;
    flex-shrink: 0;
  }
  .comment-body { flex: 1; }
  .comment-header {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    margin-bottom: 6px;
  }
  .comment-header .name { font-weight: 600; }
  .comment-header .date { color: #6B6B6B; }
  .comment-text {
    font-size: 15px;
    color: #242424;
    margin-bottom: 10px;
  }
  .comment-actions {
    display: flex;
    gap: 16px;
    font-size: 13px;
    color: #6B6B6B;
  }
</style>
</head>
<body>

<!-- ===== Topbar (kế thừa giống trang chủ) ===== -->
<div class="topbar">
  <div class="topbar-left">
    <span class="hamburger" onclick="toggleSidebar()">&#9776;</span>
    <a href="index.html" class="logo">Medium</a>
    <div class="search-box">&#128269; <span>Search</span></div>
  </div>
  <div class="topbar-right">
    <button class="btn-getapp">&#9638; Get app</button>
    <span class="write-link">&#9998; Write</span>
    <div class="lang-dropdown">
      <button class="lang-btn" onclick="toggleLangMenu()">&#127760; <span class="lang-current-label">Tiếng Việt</span> &#9662;</button>
      <div class="lang-menu">
        <a href="#" data-lang="vi" onclick="selectLanguage('vi');return false;">Tiếng Việt</a>
        <a href="#" data-lang="en" onclick="selectLanguage('en');return false;">English</a>
      </div>
    </div>
    <button class="theme-toggle" onclick="toggleTheme()"><span class="knob">&#9728;</span></button>
    <span class="icon-btn">&#128276;</span>
    <div class="avatar">N</div>
  </div>
</div>

<div class="layout" id="layoutRoot">
  <!-- ===== Sidebar (kế thừa giống trang chủ) ===== -->
  <aside class="sidebar">
    <a href="index.html"><span class="icon">&#8962;</span> Home</a>
    <a href="category.html"><span class="icon">&#128193;</span> Category</a>
    <a href="profile.html"><span class="icon">&#128100;</span> Profile</a>
    <a href="#"><span class="icon">&#128221;</span> Stories</a>
    <a href="#"><span class="icon">&#128202;</span> Stats</a>
    <hr>
    <a href="#"><span class="icon">&#128101;</span> Following</a>
    <div class="follow-box">
      Find writers and publications to follow.
      <br><span class="see-suggestions">See suggestions</span>
    </div>
  </aside>

  <!-- ===== Article content ===== -->
  <main style="grid-column: span 2;">
    <div class="article-wrapper" id="article-content-container">
      <!-- rendered by js -->
    </div>

    <!-- ===== Responses ===== -->
    <div class="responses-section">
      <div class="responses-title" id="responses-count-title">Responses (0)</div>

      <div class="comment-input" id="comment-input-area" style="display:none;">
        <div class="author-avatar" id="current-user-avatar">N</div>
        <input type="text" id="newCommentText" class="input-box" placeholder="What are your thoughts?" style="background:transparent;outline:none;" onkeypress="handleComment(event)">
      </div>

      <div id="comments-container">
        <!-- Rendered by js -->
      </div>
    </div>
  </main>
</div>

<script src="shared.js"></script>
<script src="js/mockData.js"></script>
<script>
  let currentPostId = null;

  document.addEventListener('DOMContentLoaded', () => {
    // Topbar Auth logic
    const currentUser = db.getCurrentUser();
    if (!currentUser) {
      const topbarRight = document.querySelector('.topbar-right');
      topbarRight.innerHTML = `
        <a href="login.html" style="margin-right:15px; color:#6B6B6B; text-decoration:none;">Sign In</a>
        <a href="register.html" style="background:#242424; color:#fff; padding:8px 16px; border-radius:20px; text-decoration:none;">Get Started</a>
      `;
    } else {
      document.getElementById('comment-input-area').style.display = 'flex';
      document.getElementById('current-user-avatar').textContent = (currentUser.full_name || currentUser.user_name || 'U').charAt(0).toUpperCase();
    }

    const params = new URLSearchParams(window.location.search);
    const idParam = params.get('id');
    const langId = localStorage.getItem('current_language_id') || '1';

    if (!idParam) {
      document.getElementById('article-content-container').innerHTML = '<p>Bài viết không tồn tại.</p>';
      return;
    }

    currentPostId = parseInt(idParam);
    const posts = db.getPostsWithDetails(langId);
    const post = posts.find(p => p.id === currentPostId);

    if (!post) {
      console.warn('Post not found for ID:', currentPostId);
      document.getElementById('article-content-container').innerHTML = '<p>Bài viết không tồn tại hoặc đã bị ẩn.</p>';
      return;
    }
    
    console.log('Successfully fetched post:', post);

    document.title = post.title;

    const imgUrl = `https://images.unsplash.com/photo-${1441974231531 + post.id}-c6227db76b6e?w=900`;

    document.getElementById('article-content-container').innerHTML = `
      <div class="publication">${post.category_name}</div>
      <h1 class="title">${post.title}</h1>
      <div class="byline">
        <a href="profile.html?id=${post.author_id}"><div class="author-avatar" style="background-image:url('https://api.dicebear.com/7.x/avataaars/svg?seed=${post.author_name}'); background-size:cover;"></div></a>
        <div>
          <a href="profile.html?id=${post.author_id}" class="author-name" style="color:inherit;">${post.author_name}</a>
        </div>
        <button class="follow-btn">Follow</button>
        <div class="meta">${post.date_formatted}</div>
      </div>

      <div class="toolbar">
        <span style="cursor:pointer" onclick="likePost()">&#128075; <span id="like-count">${post.likes}</span></span>
        <span>&#128172; ${post.comments}</span>
        <span class="spacer"></span>
        <span style="cursor:pointer" onclick="alert('Đã bookmark!')">&#128278;</span>
        <span>&#8943;</span>
      </div>

      <div class="hero-image" style="background-image:url('${imgUrl}');"></div>

      <div class="body-text">
        ${post.content || '<p>Không có nội dung</p>'}
      </div>
    `;

    renderComments();
  });

  function renderComments() {
    const allComments = db.get('comments').filter(c => c.post_id === currentPostId);
    const users = db.get('users');

    document.getElementById('responses-count-title').textContent = `Responses (${allComments.length})`;

    let html = '';
    allComments.forEach(c => {
      const user = users.find(u => u.id === c.user_id);
      const name = user ? (user.full_name || user.user_name) : 'Anonymous';
      const initial = name.charAt(0).toUpperCase();
      const dateStr = new Date(c.created_at).toLocaleDateString();

      html += `
        <div class="comment">
          <div class="author-avatar" style="color:#fff; display:flex; align-items:center; justify-content:center; font-size:12px;">${initial}</div>
          <div class="comment-body">
            <div class="comment-header">
              <span class="name">${name}</span>
              <span class="date">${dateStr}</span>
            </div>
            <div class="comment-text">${c.content}</div>
            <div class="comment-actions">
              <span>&#128075; 0</span>
              <span>Reply</span>
            </div>
          </div>
        </div>
      `;
    });
    document.getElementById('comments-container').innerHTML = html;
  }

  function handleComment(e) {
    if (e.key === 'Enter') {
      const text = e.target.value.trim();
      if (!text) return;

      const user = db.getCurrentUser();
      if (!user) {
        alert('Bạn cần đăng nhập để bình luận!');
        return;
      }

      const comments = db.get('comments');
      const newId = comments.length ? Math.max(...comments.map(c => c.id)) + 1 : 1;
      
      comments.push({
        id: newId,
        post_id: currentPostId,
        user_id: user.id,
        parent_id: null,
        content: text,
        created_at: new Date().toISOString(),
        updated_at: new Date().toISOString()
      });
      db.set('comments', comments);
      
      e.target.value = '';
      renderComments();
    }
  }

  function likePost() {
    const user = db.getCurrentUser();
    if (!user) {
      alert('Bạn cần đăng nhập để like!');
      return;
    }
    
    const likes = db.get('post_likes');
    const existing = likes.find(l => l.post_id === currentPostId && l.user_id === user.id);
    
    if (existing) {
      // Unlike
      const filtered = likes.filter(l => l.id !== existing.id);
      db.set('post_likes', filtered);
    } else {
      // Like
      const newId = likes.length ? Math.max(...likes.map(l => l.id)) + 1 : 1;
      likes.push({
        id: newId, post_id: currentPostId, user_id: user.id, created_at: new Date().toISOString()
      });
      db.set('post_likes', likes);
    }
    
    // update UI
    const currentLikes = db.get('post_likes').filter(l => l.post_id === currentPostId).length;
    document.getElementById('like-count').textContent = currentLikes;
  }
</script>
</body>
</html>
