<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Medium: Read and write stories.</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: #FAF9F6;
    color: #242424;
  }

  /* Header */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 24px 40px;
    border-bottom: 1px solid #F2F2F2;
  }
  .logo {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -1px;
  }
  nav {
    display: flex;
    align-items: center;
    gap: 32px;
  }
  nav a {
    text-decoration: none;
    color: #242424;
    font-size: 15px;
  }
  .btn-getstarted {
    background: #242424;
    color: #fff;
    border: none;
    padding: 12px 20px;
    border-radius: 24px;
    font-size: 15px;
    cursor: pointer;
  }

  /* Hero */
  .hero {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 60px 40px 80px 40px;
    max-width: 1336px;
    margin: 0 auto;
    gap: 40px;
  }
  .hero-text {
    flex: 1;
    min-width: 300px;
  }
  .hero-text h1 {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 84px;
    line-height: 1.05;
    font-weight: 400;
    letter-spacing: -2px;
    margin-bottom: 32px;
  }
  .hero-text p {
    font-size: 22px;
    color: #242424;
    margin-bottom: 40px;
  }
  .btn-start {
    background: #242424;
    color: #fff;
    border: none;
    padding: 16px 28px;
    border-radius: 28px;
    font-size: 17px;
    cursor: pointer;
  }

  /* Decorative graphic */
  .hero-graphic {
    flex: 1;
    min-width: 320px;
    max-width: 520px;
    position: relative;
    height: 420px;
  }
  .hero-graphic svg { width: 100%; height: 100%; }

  /* Footer */
  footer {
    border-top: 1px solid #F2F2F2;
    padding: 24px 40px;
    display: flex;
    flex-wrap: wrap;
    gap: 24px;
    justify-content: center;
  }
  footer a {
    color: #6B6B6B;
    text-decoration: none;
    font-size: 14px;
  }

  @media (max-width: 800px) {
    nav { display: none; }
    .hero { flex-direction: column; }
    .hero-text h1 { font-size: 56px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">Medium</div>
  <nav>
    <a href="#">Our story</a>
    <a href="#">Membership</a>
    <a href="#">Write</a>
    <a href="#">Sign in</a>
    <button class="btn-getstarted">Get started</button>
  </nav>
</header>

<div class="hero">
  <div class="hero-text">
    <h1>Human<br>stories &amp; ideas</h1>
    <p>A place to read, write, and deepen your understanding</p>
    <button class="btn-start">Start reading</button>
  </div>

  <div class="hero-graphic">
    <svg viewBox="0 0 500 450" xmlns="http://www.w3.org/2000/svg">
      <!-- four-leaf clover -->
      <g transform="translate(230,90) scale(1)">
        <path d="M0,-70 C40,-70 60,-30 20,0 C60,30 40,70 0,70 C-40,70 -60,30 -20,0 C-60,-30 -40,-70 0,-70 Z"
              fill="#3E8E4F"/>
        <circle cx="0" cy="0" r="20" fill="#FAF9F6"/>
      </g>

      <!-- diagram lines (simple geometric sketch) -->
      <g stroke="#242424" stroke-width="1" fill="none" opacity="0.7">
        <line x1="330" y1="60" x2="470" y2="130"/>
        <line x1="330" y1="60" x2="300" y2="180"/>
        <line x1="300" y1="180" x2="470" y2="130"/>
        <line x1="330" y1="60" x2="380" y2="150"/>
        <circle cx="330" cy="60" r="2" fill="#242424"/>
        <circle cx="470" cy="130" r="2" fill="#242424"/>
        <circle cx="300" cy="180" r="2" fill="#242424"/>
      </g>

      <!-- green square with hand writing -->
      <g transform="translate(260,220)">
        <rect x="0" y="0" width="220" height="220" fill="#3E8E4F"/>
        <!-- stars -->
        <g fill="#FAF9F6">
          <circle cx="180" cy="30" r="3"/>
          <circle cx="160" cy="60" r="2"/>
          <circle cx="30" cy="200" r="2"/>
          <circle cx="55" cy="215" r="2"/>
        </g>
        <!-- hand + pencil (simplified) -->
        <path d="M40,190 C30,170 40,140 70,130 C100,120 130,100 150,70
                 C160,60 175,65 170,80 C160,105 140,120 120,140
                 C140,140 160,150 150,170 C140,185 100,200 70,200 Z"
              fill="#FAF9F6"/>
        <rect x="150" y="55" width="70" height="12" rx="6"
              transform="rotate(-35 150 55)" fill="#FAF9F6"/>
      </g>

      <!-- scattered stars outside the square -->
      <g fill="#242424">
        <circle cx="240" cy="330" r="3"/>
        <circle cx="220" cy="360" r="2"/>
        <circle cx="255" cy="390" r="2"/>
        <circle cx="210" cy="410" r="2"/>
        <circle cx="180" cy="330" r="2"/>
      </g>
    </svg>
  </div>
</div>

<footer>
  <a href="#">Help</a>
  <a href="#">Status</a>
  <a href="#">About</a>
  <a href="#">Careers</a>
  <a href="#">Press</a>
  <a href="#">Blog</a>
  <a href="#">Store</a>
  <a href="#">Privacy</a>
  <a href="#">Rules</a>
  <a href="#">Terms</a>
  <a href="#">Text to speech</a>
</footer>

</body>
</html>
