<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>

<title>Khôi phục mật khẩu – Medium</title>
<link rel="stylesheet" href="shared.css">
<style>
  .auth-topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 32px;
    border-bottom: 1px solid var(--border);
  }
  .auth-wrapper {
    max-width: 380px;
    margin: 60px auto;
    padding: 0 20px;
  }
  .auth-wrapper h1 {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 30px;
    font-weight: 400;
    margin-bottom: 12px;
  }
  .auth-wrapper .desc {
    font-size: 15px;
    color: var(--text-muted);
    margin-bottom: 28px;
    line-height: 1.5;
  }
  .btn-primary-block {
    width: 100%;
    background: var(--text);
    color: var(--bg);
    border: none;
    border-radius: 24px;
    padding: 12px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 14px;
    color: var(--text-muted);
    margin-bottom: 24px;
  }
  .success-box {
    display: none;
    background: var(--accent-soft);
    color: var(--accent);
    border-radius: 8px;
    padding: 16px;
    font-size: 14px;
    margin-top: 20px;
    line-height: 1.5;
  }
</style>
</head>
<body>

<div class="auth-topbar">
  <a href="index.html" class="logo">Medium</a>
  <button class="theme-toggle" onclick="toggleTheme()"><span class="knob"><iconify-icon icon="solar:sun-bold"></iconify-icon></span></button>
</div>

<div class="auth-wrapper">
  <a href="login.html" class="back-link"><iconify-icon icon="solar:arrow-left-linear"></iconify-icon> Quay lại đăng nhập</a>
  <h1>Khôi phục mật khẩu</h1>
  <div class="desc">Nhập email đã đăng ký, chúng tôi sẽ gửi cho bạn liên kết để đặt lại mật khẩu.</div>

  <form id="recoverForm" onsubmit="return handleRecover(event);">
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="email" class="form-control" placeholder="you@example.com" required>
    </div>
    <button type="submit" class="btn-primary-block">Gửi liên kết khôi phục</button>
  </form>

  <div class="success-box" id="successBox">
    <iconify-icon icon="solar:check-circle-bold-duotone"></iconify-icon> Nếu email tồn tại trong hệ thống, một liên kết khôi phục mật khẩu đã được gửi tới hộp thư của bạn.
  </div>
</div>

<script src="shared.js"></script>
<script src="js/mockData.js"></script>
<script>
  function handleRecover(e) {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const users = db.get('users');
    
    if (users.find(u => u.email === email)) {
      document.getElementById('successBox').style.display = 'block';
      document.getElementById('recoverForm').style.display = 'none';
    } else {
      alert('Email này chưa được đăng ký trong hệ thống!');
    }
    return false;
  }
</script>
</body>
</html>
