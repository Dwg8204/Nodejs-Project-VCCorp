<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Đăng nhập – Medium</title>
<link rel="stylesheet" href="shared.css">
<style>
  .auth-topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 32px;
    border-bottom: 1px solid var(--border);
  }
  .auth-wrapper {
    max-width: 380px;
    margin: 60px auto;
    padding: 0 20px;
  }
  .auth-wrapper h1 {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 32px;
    font-weight: 400;
    text-align: center;
    margin-bottom: 32px;
  }
  .social-btn {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    border: 1px solid var(--border-strong);
    border-radius: 24px;
    padding: 12px;
    font-size: 15px;
    background: var(--card-bg);
    color: var(--text);
    cursor: pointer;
    margin-bottom: 12px;
  }
  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    color: var(--text-muted);
    font-size: 13px;
    margin: 24px 0;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }
  .btn-primary-block {
    width: 100%;
    background: var(--text);
    color: var(--bg);
    border: none;
    border-radius: 24px;
    padding: 12px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  .auth-footer-text {
    text-align: center;
    font-size: 14px;
    color: var(--text-muted);
    margin-top: 24px;
  }
  .auth-footer-text a { color: var(--accent); font-weight: 600; }
  .forgot-link {
    display: block;
    text-align: right;
    font-size: 13px;
    color: var(--text-muted);
    margin: -12px 0 20px 0;
  }
</style>
</head>
<body>

<div class="auth-topbar">
  <a href="index.html" class="logo">Medium</a>
  <div style="display:flex; align-items:center; gap:16px;">
    <button class="theme-toggle" onclick="toggleTheme()"><span class="knob">&#9728;</span></button>
    <span style="font-size:14px; color:var(--text-muted);">Chưa có tài khoản?</span>
    <a href="register.html" class="btn" style="border:1px solid var(--text); color:var(--text); padding:8px 18px;">Đăng ký</a>
  </div>
</div>

<div class="auth-wrapper">
  <h1>Chào mừng trở lại</h1>

  <button class="social-btn">&#128421; Đăng nhập với Google</button>
  <button class="social-btn">&#61805; Đăng nhập với Facebook</button>

  <div class="divider">hoặc</div>

  <form id="loginForm">
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="email" class="form-control" placeholder="you@example.com" required>
    </div>
    <div class="form-group">
      <label>Mật khẩu</label>
      <input type="password" id="password" class="form-control" placeholder="••••••••" required>
    </div>
    <a href="forgot-password.html" class="forgot-link">Quên mật khẩu?</a>
    <button type="submit" class="btn-primary-block">Đăng nhập</button>
  </form>

  <div class="auth-footer-text">
    Chưa có tài khoản? <a href="register.html">Đăng ký ngay</a>
  </div>
</div>

<script src="shared.js"></script>
<script src="js/mockData.js"></script>
<script>
  document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    
    if (db.login(email, password)) {
      const user = db.getCurrentUser();
      alert('Đăng nhập thành công!');
      if (user.role_id === 1) {
        window.location.href = 'admin-users.html';
      } else if (user.role_id === 2) {
        window.location.href = 'owner-posts.html';
      } else {
        window.location.href = 'index.html';
      }
    } else {
      alert('Email hoặc mật khẩu không đúng!');
    }
  });
</script>
</body>
</html>
