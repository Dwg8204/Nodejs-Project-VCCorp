<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>

  <title>Quản lý bài viết – Medium</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    .owner-main {
      padding: 24px 40px;
    }

    .owner-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .owner-header h1 {
      /* font-family: Georgia, 'Times New Roman', serif; */
      font-size: 32px;
      font-weight: 400;
    }

    .post-title-cell {
      font-weight: 600;
      cursor: pointer;
    }

    .post-title-cell:hover {
      text-decoration: underline;
    }

    .action-icons {
      display: flex;
      gap: 12px;
    }

    .action-icons a,
    .action-icons button {
      font-size: 15px;
      cursor: pointer;
      background: none;
      border: none;
      color: var(--text-muted);
    }

    .action-icons .delete-icon:hover {
      color: var(--danger);
    }

    .action-icons .edit-icon:hover {
      color: var(--text);
    }

    .stats-row {
      display: flex;
      gap: 16px;
      margin-bottom: 24px;
    }

    .stat-card {
      flex: 1;
      padding: 16px 20px;
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    .stat-card .num {
      font-size: 24px;
      font-weight: 700;
    }

    .stat-card .label {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }
  </style>
</head>

<body>

  <div class="topbar">
    <div class="topbar-left">
      <span class="hamburger" onclick="toggleSidebar()"><iconify-icon icon="solar:hamburger-menu-bold-duotone"></iconify-icon></span>
      <a href="index.html" class="logo">Medium</a>
      <div class="search-box"><iconify-icon icon="solar:magnifer-linear"></iconify-icon><input type="text" data-i18n-placeholder="search_placeholder" placeholder="Tìm kiếm bài viết..." onkeydown="handleTopbarSearch(event)"></div>
    </div>
    <div class="topbar-right">
      <div class="lang-dropdown">
        <button class="lang-btn" onclick="toggleLangMenu()"><iconify-icon icon="solar:global-bold-duotone"></iconify-icon> <span class="lang-current-label">Tiếng Việt</span>
          <iconify-icon icon="solar:alt-arrow-down-linear"></iconify-icon></button>
        <div class="lang-menu">
          <a href="#" data-lang="vi" onclick="selectLanguage('vi');return false;">Tiếng Việt</a>
          <a href="#" data-lang="en" onclick="selectLanguage('en');return false;">English</a>
        </div>
      </div>
      <button class="theme-toggle" onclick="toggleTheme()"><span class="knob"><iconify-icon icon="solar:sun-bold"></iconify-icon></span></button>
      <div class="avatar">N</div>
    </div>
  </div>

  <div class="layout no-rail" id="layoutRoot">
        <aside class="sidebar">
      <a href="index.html"><span class="icon"><iconify-icon icon="solar:home-2-bold-duotone"></iconify-icon></span> <span data-i18n="home">Home</span></a>
      <a href="profile.html"><span class="icon"><iconify-icon icon="solar:user-circle-bold-duotone"></iconify-icon></span> <span data-i18n="profile">Profile</span></a>
      <a href="owner-posts.html" class="active"><span class="icon"><iconify-icon icon="solar:document-text-bold-duotone"></iconify-icon></span> <span data-i18n="manage_posts">Manage posts</span></a>
    </aside>

    <main class="owner-main">
      <div class="owner-header">
        <h1>Quản lý bài viết</h1>
        <a href="post-form.html" class="btn btn-primary" data-i18n="write_new_post">+ Viết bài mới</a>
      </div>

      <div class="stats-row" id="stats-container">
        <!-- rendered by JS -->
      </div>

      <div class="card">
        <table class="data-table fixed-cols">
          <colgroup>
            <col style="width:34%;">
            <col style="width:14%;">
            <col style="width:13%;">
            <col style="width:14%;">
            <col style="width:15%;">
            <col style="width:10%;">
          </colgroup>
          <thead>
            <tr>
              <th>Tiêu đề</th>
              <th>Danh mục</th>
              <th>Ngôn ngữ</th>
              <th>Trạng thái</th>
              <th>Ngày đăng</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="posts-tbody">
            <!-- Rendered by js -->
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="shared.js"></script>
  <script src="js/mockData.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const user = db.getCurrentUser();
      if (!user || user.role_id !== 2) {
        alert('Vui lòng đăng nhập với tài khoản Chủ Blog!');
        window.location.href = 'login.html';
        return;
      }

      const rawPosts = db.get('posts').filter(p => p.author_id === user.id);
      const langId = localStorage.getItem('current_language_id') || '1';

      // Calculate stats
      const total = rawPosts.length;
      const published = rawPosts.filter(p => p.status === 'PUBLISHED').length;
      const drafts = total - published;

      document.getElementById('stats-container').innerHTML = `
      <div class="stat-card"><div class="num">${total}</div><div class="label">Tổng bài viết</div></div>
      <div class="stat-card"><div class="num">${published}</div><div class="label">Đã xuất bản</div></div>
      <div class="stat-card"><div class="num">${drafts}</div><div class="label">Bản nháp</div></div>
    `;

      // Lấy bài viết chi tiết để render
      const allDetailPosts = db.getPostsWithDetails(langId);

      let html = '';
      rawPosts.forEach(rp => {
        // Vì rawPosts không có title, ta tìm trong allDetailPosts hoặc gọi lấy lại
        let detail = allDetailPosts.find(p => p.id === rp.id);

        // Fallback nếu bài draft không có trong getPostsWithDetails (vì hàm đó lọc PUBLISHED)
        if (!detail) {
          const translations = db.get('post_translations');
          const catTrans = db.get('category_translation');
          let pt = translations.find(t => t.post_id === rp.id && t.language_id == langId) ||
            translations.find(t => t.post_id === rp.id);
          let ct = catTrans.find(c => c.category_id === rp.category_id && c.language_id == langId) ||
            catTrans.find(c => c.category_id === rp.category_id);

          detail = {
            title: pt ? pt.title : 'Untitled',
            category_name: ct ? ct.name : 'Unknown',
            created_at: rp.created_at,
            status: rp.status
          };
        }

        const dateStr = new Date(detail.created_at).toLocaleDateString();
        const statusBadge = rp.status === 'PUBLISHED'
          ? '<span class="badge badge-green">Đã xuất bản</span>'
          : '<span class="badge badge-gray">Bản nháp</span>';

        html += `
        <tr>
          <td class="post-title-cell wrap" onclick="location.href='article.html?id=${rp.id}'">${detail.title}</td>
          <td>${detail.category_name}</td>
          <td>VI / EN</td>
          <td>${statusBadge}</td>
          <td>${dateStr}</td>
          <td>
            <div class="action-icons">
              <a href="post-form.html?id=${rp.id}" class="edit-icon" title="Sửa"><iconify-icon icon="solar:pen-new-square-bold-duotone"></iconify-icon></a>
              <button class="delete-icon" title="Xóa" onclick="deletePost(${rp.id}, '${detail.title}')"><iconify-icon icon="solar:trash-bin-trash-bold-duotone"></iconify-icon></button>
            </div>
          </td>
        </tr>
      `;
      });

      document.getElementById('posts-tbody').innerHTML = html;
    });

    function deletePost(id, title) {
      openConfirmModal(`Xóa bài viết "${title}"?`, () => {
        const posts = db.get('posts');
        const filtered = posts.filter(p => p.id !== id);
        db.set('posts', filtered);
        location.reload();
      }, { title: 'Xóa bài viết' });
    }
  </script>
</body>

</html>
