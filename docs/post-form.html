<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
  <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
  <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>

  <title>Viết bài – Medium</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    .form-layout-wrap {
      display: flex;
      gap: 0;
      min-height: calc(100vh - 60px);
    }

    .form-main {
      padding: 24px 40px 80px 40px;
      flex: 1;
      min-width: 0;
      max-width: 760px;
    }

    .form-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .form-header h1 {
      font-size: 28px;
      font-weight: 600;
    }

    .form-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .lang-row {
      display: flex;
      gap: 16px;
    }

    .lang-row .form-group {
      flex: 1;
    }

    .translate-section {
      border-top: 1px solid var(--border);
      margin-top: 32px;
      padding-top: 24px;
    }

    .translate-section h2 {
      font-size: 18px;
      margin-bottom: 6px;
    }

    .translate-section .desc {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 16px;
      line-height: 1.5;
    }

    /* Quill */
    #postContentEditor {
      background: var(--card-bg);
      color: var(--text);
      min-height: 260px;
      font-size: 16px;
      border-bottom-left-radius: 6px;
      border-bottom-right-radius: 6px;
    }

    .ql-toolbar.ql-snow {
      border-color: var(--border-strong) !important;
      border-top-left-radius: 6px;
      border-top-right-radius: 6px;
      background: var(--bg-soft);
    }

    .ql-container.ql-snow {
      border-color: var(--border-strong) !important;
    }

    .ql-snow .ql-stroke {
      stroke: var(--text) !important;
    }

    .ql-snow .ql-fill {
      fill: var(--text) !important;
    }

    .ql-snow .ql-picker {
      color: var(--text) !important;
    }

    .ql-snow .ql-picker-options {
      background: var(--card-bg) !important;
    }

    .ql-editor.ql-blank::before {
      color: var(--text-muted) !important;
    }

    .ql-editor { overflow-wrap: anywhere; }
    .ql-editor img,
    .preview-content-text img {
      display: block;
      width: auto;
      max-width: 100% !important;
      height: auto !important;
      margin: 16px auto;
      object-fit: contain;
    }

    .thumbnail-upload {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 160px;
      gap: 16px;
      align-items: stretch;
    }
    .thumbnail-dropzone {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-height: 112px;
      padding: 18px;
      border: 1px dashed var(--border-strong);
      border-radius: 10px;
      background: var(--bg-soft);
      color: var(--text-muted);
      cursor: pointer;
      text-align: center;
    }
    .thumbnail-dropzone:hover { border-color: var(--accent); color: var(--accent); }
    .thumbnail-dropzone iconify-icon { flex: 0 0 auto; font-size: 24px; }
    .thumbnail-preview {
      min-height: 112px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg-soft) center / cover no-repeat;
    }
    .preview-thumbnail {
      display: none;
      width: 100%;
      max-height: 240px;
      margin: 4px 0 18px;
      border-radius: 10px;
      object-fit: cover;
    }
    @media (max-width: 600px) {
      .thumbnail-upload { grid-template-columns: 1fr; }
      .thumbnail-preview { min-height: 180px; }
    }

    .translate-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 8px;
    }

    .translation-panel {
      display: none;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px;
      margin-top: 16px;
    }

    .translation-panel.open {
      display: block;
    }

    .translation-panel .panel-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 15px;
      margin-bottom: 16px;
    }

    .translation-panel .badge-auto {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 400;
      background: var(--bg-pill);
      padding: 2px 8px;
      border-radius: 10px;
    }

    .panel-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 8px;
    }

    /* Preview side panel */
    .preview-side-panel {
      width: 0;
      overflow: hidden;
      border-left: 1px solid var(--border);
      background: var(--card-bg);
      transition: width 0.3s ease;
      position: sticky;
      top: 60px;
      height: calc(100vh - 60px);
      flex-shrink: 0;
    }

    .preview-side-panel.open {
      width: 380px;
      min-width: 280px;
    }

    .preview-panel-inner {
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
      height: 100%;
      min-height: 0;
      padding: 24px 28px;
      min-width: 320px;
    }

    #previewPanelBody {
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
    }

    .preview-panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .preview-panel-header h3 {
      font-size: 16px;
      font-weight: 700;
    }

    .preview-close-btn {
      font-size: 20px;
      cursor: pointer;
      color: var(--text-muted);
      background: none;
      border: none;
      display: flex;
      align-items: center;
    }

    .preview-lang-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .preview-lang-tab {
      border: 1px solid var(--border-strong);
      border-radius: 14px;
      padding: 4px 12px;
      font-size: 13px;
      cursor: pointer;
      background: none;
      color: var(--text-muted);
      transition: all 0.15s;
    }

    .preview-lang-tab.active {
      background: var(--text);
      color: var(--bg);
      border-color: var(--text);
    }

    .preview-lang-badge {
      display: inline-block;
      font-size: 12px;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 3px 10px;
      border-radius: 10px;
      margin-bottom: 12px;
    }

    .preview-title-text {
      font-family: inherit;
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 12px;
      line-height: 1.3;
    }

    .preview-content-text {
      font-size: 15px;
      line-height: 1.7;
      color: var(--text);
    }

    /* Toggle preview button */
    .btn-preview-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--border-strong);
      border-radius: 20px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      background: none;
      color: var(--text);
      transition: all 0.15s;
    }

    .btn-preview-toggle:hover {
      background: var(--bg-soft);
    }

    .btn-preview-toggle.active {
      background: var(--text);
      color: var(--bg);
      border-color: var(--text);
    }
  </style>
</head>

<body>

  <div class="topbar">
    <div class="topbar-left">
      <span class="hamburger" onclick="toggleSidebar()"><iconify-icon
          icon="material-symbols:menu-rounded"></iconify-icon></span>
      <a href="index.html" class="logo">Medium</a>
      <div class="search-box-wrap" id="topSearchWrap">
        <iconify-icon icon="solar:magnifer-linear"></iconify-icon>
        <input class="search-input" id="topSearchInput" type="text" placeholder="Search...">
        <div class="search-results-dropdown" id="topSearchDropdown"></div>
      </div>
    </div>
    <div class="topbar-right">
      <div class="lang-dropdown">
        <button class="lang-btn" onclick="toggleLangMenu()">
          <span class="lang-current-label">English</span>
          <iconify-icon icon="solar:alt-arrow-down-linear"></iconify-icon>
        </button>
        <div class="lang-menu">
          <a href="#" data-lang="vi" onclick="selectLanguage('vi');return false;">Tiếng Việt</a>
          <a href="#" data-lang="en" onclick="selectLanguage('en');return false;">English</a>
        </div>
      </div>
      <button class="theme-toggle" onclick="toggleTheme()"><span class="knob"><iconify-icon
            icon="solar:sun-bold"></iconify-icon></span></button>
      <div class="avatar">N</div>
    </div>
  </div>

  <div class="layout no-rail" id="layoutRoot">
    <aside class="sidebar" id="mainSidebar">
      <a href="index.html"><span class="icon"><iconify-icon icon="material-symbols:home-rounded"></iconify-icon></span>
        <span data-vi="Trang chủ" data-en="Home">Home</span></a>
      <a href="profile.html"><span class="icon"><iconify-icon icon="solar:user-bold"></iconify-icon></span>
        <span data-vi="Hồ sơ" data-en="Profile">Profile</span></a>
      <a href="owner-posts.html"><span class="icon"><iconify-icon icon="fluent-mdl2:blog"></iconify-icon></span> <span
          data-vi="Quản lý bài viết" data-en="Manage posts">Manage posts</span></a>
    </aside>

    <!-- Wrap form + preview side panel -->
    <div class="form-layout-wrap">
      <main class="form-main">
        <div class="form-header">
          <h1 id="formTitle" data-vi="Viết bài mới" data-en="New Post">New Post</h1>
          <div class="form-actions">
            <a href="owner-posts.html" class="btn btn-outline" data-vi="Hủy" data-en="Cancel">Cancel</a>
            <button class="btn btn-outline" onclick="savePost('DRAFT')" data-vi="Lưu nháp" data-en="Save Draft">Save
              Draft</button>
            <button class="btn-preview-toggle" id="previewToggleBtn" onclick="togglePreviewPanel()">
              <iconify-icon icon="iconamoon:eye"></iconify-icon> Preview
            </button>
            <button class="btn btn-primary" id="submitPostBtn" onclick="submitPostForWorkflow()" data-vi="Gửi duyệt"
              data-en="Submit for review">Submit for review</button>
          </div>
        </div>
        <div class="post-workflow-notice" id="postWorkflowNotice" hidden></div>

        <form onsubmit="return false;">
          <div class="lang-row">
            <div class="form-group">
              <label data-vi="Ngôn ngữ bài viết" data-en="Post Language">Post Language</label>
              <select class="form-control" id="sourceLang" onchange="onSourceLangChange()">
                <!-- Rendered by js -->
              </select>
            </div>
            <div class="form-group">
              <label data-vi="Danh mục" data-en="Category">Category</label>
              <select class="form-control" id="categoryId">
                <!-- Rendered by js -->
              </select>
            </div>
          </div>

          <div class="form-group">
            <label data-vi="Tiêu đề bài viết" data-en="Post Title">Post Title</label>
            <input type="text" id="postTitle" class="form-control" placeholder="Nhập tiêu đề bài viết..."
              oninput="updatePreview()">
          </div>

          <div class="form-group">
            <label data-vi="Ảnh đại diện bài viết" data-en="Post thumbnail">Post thumbnail</label>
            <div class="thumbnail-upload">
              <label class="thumbnail-dropzone" for="postThumbnail">
                <iconify-icon icon="solar:gallery-add-bold-duotone"></iconify-icon>
                <span data-vi="Chọn ảnh JPG, PNG hoặc WebP (tối đa 5 MB)" data-en="Choose a JPG, PNG or WebP image (max 5 MB)">Choose a JPG, PNG or WebP image (max 5 MB)</span>
              </label>
              <div class="thumbnail-preview" id="thumbnailPreview" role="img" aria-label="Post thumbnail preview"></div>
            </div>
            <input type="file" id="postThumbnail" accept="image/jpeg,image/png,image/webp,image/gif" hidden onchange="handleThumbnailChange(this)">
          </div>

          <div class="form-group">
            <label data-vi="Nội dung bài viết" data-en="Post Content">Post Content</label>
            <div id="postContentEditor"></div>
          </div>

          <div class="translate-section">
            <h2 data-vi="Dịch sang ngôn ngữ khác" data-en="Translate to other languages">Translate to other languages
            </h2>
            <div class="desc" data-vi="Chọn ngôn ngữ bạn muốn dịch và điền tiêu đề + nội dung tương ứng."
              data-en="Select languages to translate and enter title + content for each.">Select languages to translate
              and enter title + content for each.</div>
            <div class="translate-pills" id="translatePills"><!-- Rendered by js --></div>
          </div>
        </form>
      </main>

      <!-- Preview side panel -->
      <div class="preview-side-panel" id="previewSidePanel">
        <div class="preview-panel-inner">
          <div class="preview-panel-header">
            <h3><iconify-icon icon="iconamoon:eye"></iconify-icon> Preview</h3>
            <button class="preview-close-btn" onclick="togglePreviewPanel()">
              <iconify-icon icon="solar:close-circle-bold-duotone"></iconify-icon>
            </button>
          </div>
          <div class="preview-lang-tabs" id="previewLangTabs"></div>
          <div id="previewPanelBody">
            <span class="preview-lang-badge" id="previewLangBadge">English</span>
            <div class="preview-title-text" id="previewPanelTitle">(Chưa có tiêu đề)</div>
            <img class="preview-thumbnail" id="previewThumbnail" alt="Post thumbnail preview">
            <div class="preview-content-text" id="previewPanelContent"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="shared.js"></script>
  <script src="js/mockData.js"></script>
  <script>
    let LANG_NAMES = {};
    let LANG_OBJS = [];
    let currentPostId = null;
    let quill = null;
    let previewOpen = false;
    let currentPreviewLang = null;
    let previewUpdateTimer = null;
    let previewRequestId = 0;
    let thumbnailData = '';
    const draftTranslationCache = new Map();
    const browserTranslators = new Map();

    window.addEventListener('DOMContentLoaded', () => {
      const user = db.getCurrentUser();
      if (!user || user.role_id === 3) {
        recordAuditLog({ action: 'AUTH_ACCESS_DENIED', entityType: 'PAGE', entityLabel: 'post-form.html', metadata: { path: location.pathname }, actor: user || null });
        showToast('Vui lòng đăng nhập với tài khoản hợp lệ!', 'error');
        setTimeout(() => window.location.href = 'login.html', 1500);
        return;
      }
      configurePostWorkflow(user);

      quill = new Quill('#postContentEditor', {
        theme: 'snow',
        placeholder: 'Viết nội dung ở đây...',
        modules: {
          toolbar: [
            [{ header: [2, 3, false] }],
            ['bold', 'italic', 'underline', 'strike'],
            ['blockquote', 'code-block'],
            [{ list: 'ordered' }, { list: 'bullet' }],
            ['link', 'image'],
            ['clean']
          ]
        }
      });
      quill.on('text-change', updatePreview);

      const languages = db.get('languages');
      const categories = db.get('categories');
      const categoryTranslations = db.get('category_translation');
      const langId = localStorage.getItem('current_language_id') || '1';

      LANG_OBJS = languages;
      let langOptionsHtml = '';
      let pillsHtml = '';
      languages.forEach(l => {
        LANG_NAMES[l.code] = l.name;
        langOptionsHtml += `<option value="${l.code}">${l.name}</option>`;
        pillsHtml += `
          <label class="checkbox-pill" data-lang="${l.code}">
            <input type="checkbox" value="${l.code}" onchange="onTranslateToggle(this)"> ${flagImgFor(l.code)} ${l.name}
          </label>`;
      });
      document.getElementById('sourceLang').innerHTML = langOptionsHtml;
      document.getElementById('translatePills').innerHTML = pillsHtml;

      let catOptionsHtml = '';
      categories.forEach(c => {
        let t = categoryTranslations.find(x => x.category_id === c.id && x.language_id == langId);
        if (!t) t = categoryTranslations.find(x => x.category_id === c.id);
        catOptionsHtml += `<option value="${c.id}">${t ? t.name : 'Unknown'}</option>`;
      });
      document.getElementById('categoryId').innerHTML = catOptionsHtml;

      // Set default source lang from current UI lang
      const uiLang = localStorage.getItem('blog-lang') || 'en';
      const uiLangObj = languages.find(l => l.code === uiLang);
      if (uiLangObj) document.getElementById('sourceLang').value = uiLang;
      onSourceLangChange();

      const params = new URLSearchParams(window.location.search);
      if (params.get('id')) {
        document.getElementById('formTitle').dataset.vi = 'Chỉnh sửa bài viết';
        document.getElementById('formTitle').dataset.en = 'Edit Post';
        currentPostId = parseInt(params.get('id'));
        const editingPost = db.get('posts').find(post => post.id === currentPostId);
        if (!editingPost || (user.role_id !== 1 && editingPost.author_id !== user.id)) {
          showToast(localStorage.getItem('blog-lang') === 'en' ? 'You cannot edit this post.' : 'Bạn không có quyền chỉnh sửa bài viết này!', 'error');
          setTimeout(() => window.location.href = 'owner-posts.html', 1200);
          return;
        }
        loadPostData(currentPostId);
      }

      // Init preview tabs
      renderPreviewTabs();
      applyLanguage(localStorage.getItem('blog-lang') || 'vi');
      initSearch(() => db.getPostsWithDetails(langId));
    });

    function configurePostWorkflow(user) {
      const button = document.getElementById('submitPostBtn');
      const requiresReview = user.role_id !== 1 && getSystemSettings().require_post_approval;
      button.dataset.vi = requiresReview ? 'Gửi duyệt' : 'Xuất bản';
      button.dataset.en = requiresReview ? 'Submit for review' : 'Publish';
      button.textContent = localStorage.getItem('blog-lang') === 'en' ? button.dataset.en : button.dataset.vi;
    }

    function submitPostForWorkflow() {
      savePost('SUBMIT');
    }

    function renderPreviewTabs() {
      const sourceLang = document.getElementById('sourceLang') ? document.getElementById('sourceLang').value : 'en';
      const languages = LANG_OBJS;
      const tabs = [{ code: sourceLang, name: LANG_NAMES[sourceLang] || sourceLang }];
      // Add checked translations
      document.querySelectorAll('#translatePills input:checked').forEach(cb => {
        const lObj = LANG_OBJS.find(l => l.code === cb.value);
        if (lObj) tabs.push({ code: lObj.code, name: lObj.name });
      });
      if (!currentPreviewLang) currentPreviewLang = sourceLang;
      document.getElementById('previewLangTabs').innerHTML = tabs.map(t => `
        <button class="preview-lang-tab ${t.code === currentPreviewLang ? 'active' : ''}"
          onclick="switchPreviewLang('${t.code}')">${t.name}</button>`).join('');
      updatePreview();
    }

    function switchPreviewLang(langCode) {
      currentPreviewLang = langCode;
      renderPreviewTabs();
    }

    function updatePreview() {
      if (!previewOpen) return;
      clearTimeout(previewUpdateTimer);
      previewUpdateTimer = setTimeout(performPreviewUpdate, 220);
    }

    async function getBrowserTranslator(sourceLanguage, targetLanguage) {
      const key = `${sourceLanguage}:${targetLanguage}`;
      if (browserTranslators.has(key)) return browserTranslators.get(key);
      if (!('Translator' in window) || typeof window.Translator.create !== 'function') {
        throw new Error('TRANSLATOR_UNAVAILABLE');
      }
      const translator = await window.Translator.create({ sourceLanguage, targetLanguage });
      browserTranslators.set(key, translator);
      return translator;
    }

    async function translateDraft(title, html, sourceLanguage, targetLanguage) {
      const cacheKey = `${sourceLanguage}:${targetLanguage}:${title}:${html}`;
      if (draftTranslationCache.has(cacheKey)) return draftTranslationCache.get(cacheKey);
      const translator = await getBrowserTranslator(sourceLanguage, targetLanguage);
      const translatedTitle = title ? await translator.translate(title) : title;
      const container = document.createElement('div');
      container.innerHTML = html;
      const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT);
      const nodes = [];
      while (walker.nextNode()) {
        if (walker.currentNode.nodeValue.trim()) nodes.push(walker.currentNode);
      }
      await Promise.all(nodes.map(async node => {
        const raw = node.nodeValue;
        const leading = raw.match(/^\s*/)?.[0] || '';
        const trailing = raw.match(/\s*$/)?.[0] || '';
        node.nodeValue = leading + await translator.translate(raw.trim()) + trailing;
      }));
      const result = { title: translatedTitle, content: container.innerHTML };
      draftTranslationCache.set(cacheKey, result);
      return result;
    }

    async function performPreviewUpdate() {
      if (!previewOpen) return;
      const requestId = ++previewRequestId;
      const lang = currentPreviewLang || document.getElementById('sourceLang')?.value || 'en';
      const sourceLang = document.getElementById('sourceLang')?.value || 'en';
      const title = document.getElementById('postTitle')?.value || '(Chưa có tiêu đề)';
      const content = quill ? quill.root.innerHTML : '';
      const lObj = LANG_OBJS.find(l => l.code === lang);
      const langName = lObj ? `${flagImgFor(lObj.code)} ${lObj.name}` : lang;

      let previewTitle = title;
      let previewContent = content;
      if (lang !== sourceLang) {
        document.getElementById('previewPanelTitle').textContent = localStorage.getItem('blog-lang') === 'en' ? 'Translating…' : 'Đang dịch…';
        document.getElementById('previewPanelContent').innerHTML = '<div class="preview-translating"><span></span><span></span><span></span></div>';
        try {
          const translated = await translateDraft(title, content, sourceLang, lang);
          if (requestId !== previewRequestId) return;
          previewTitle = translated.title;
          previewContent = translated.content;
        } catch (error) {
          if (requestId !== previewRequestId) return;
          previewTitle = title;
          previewContent = `<div class="preview-translation-notice"><iconify-icon icon="solar:info-circle-bold-duotone"></iconify-icon><span>${localStorage.getItem('blog-lang') === 'en' ? 'On-device translation is not available in this browser yet.' : 'Trình duyệt này chưa hỗ trợ mô hình dịch trực tiếp trên thiết bị.'}</span></div>${content}`;
        }
      }
      document.getElementById('previewLangBadge').innerHTML = langName;
      document.getElementById('previewPanelTitle').textContent = previewTitle || '(Chưa có tiêu đề)';
      const previewThumbnail = document.getElementById('previewThumbnail');
      previewThumbnail.src = thumbnailData || '';
      previewThumbnail.style.display = thumbnailData ? 'block' : 'none';
      document.getElementById('previewPanelContent').innerHTML = previewContent;
    }

    function handleThumbnailChange(input) {
      const file = input.files && input.files[0];
      if (!file) return;
      const english = localStorage.getItem('blog-lang') === 'en';
      if (!file.type.startsWith('image/')) {
        showToast(english ? 'Please choose a valid image.' : 'Vui lòng chọn tệp ảnh hợp lệ.', 'error');
        input.value = '';
        return;
      }
      if (file.size > 5 * 1024 * 1024) {
        showToast(english ? 'The image must not exceed 5 MB.' : 'Ảnh không được vượt quá 5 MB.', 'error');
        input.value = '';
        return;
      }
      const reader = new FileReader();
      reader.onload = () => {
        thumbnailData = String(reader.result || '');
        renderThumbnailPreview();
        updatePreview();
      };
      reader.readAsDataURL(file);
    }

    function renderThumbnailPreview() {
      const preview = document.getElementById('thumbnailPreview');
      preview.style.backgroundImage = thumbnailData ? `url("${thumbnailData.replace(/"/g, '%22')}")` : '';
    }

    function togglePreviewPanel() {
      previewOpen = !previewOpen;
      const panel = document.getElementById('previewSidePanel');
      const btn = document.getElementById('previewToggleBtn');
      panel.classList.toggle('open', previewOpen);
      btn.classList.toggle('active', previewOpen);
      if (previewOpen) { renderPreviewTabs(); updatePreview(); }
    }

    function onSourceLangChange() {
      const source = document.getElementById('sourceLang').value;
      document.querySelectorAll('#translatePills .checkbox-pill').forEach(pill => {
        const isSource = pill.dataset.lang === source;
        pill.style.display = isSource ? 'none' : 'inline-flex';
        if (isSource) {
          const cb = pill.querySelector('input');
          if (cb.checked) { cb.checked = false; onTranslateToggle(cb); }
        }
      });
      currentPreviewLang = source;
      renderPreviewTabs();
    }

    function onTranslateToggle(checkbox) {
      const pill = checkbox.closest('.checkbox-pill');
      pill.classList.toggle('active', checkbox.checked);
      renderPreviewTabs();
    }

    function loadPostData(postId) {
      const posts = db.get('posts');
      const translations = db.get('post_translations');
      const languages = db.get('languages');
      const post = posts.find(p => p.id === postId);
      if (!post) return;
      renderPostWorkflowNotice(post);

      thumbnailData = post.thumbnail || '';
      renderThumbnailPreview();

      document.getElementById('categoryId').value = post.category_id;
      const sourceLangObj = languages.find(l => l.id === post.source_language_id);
      if (sourceLangObj) {
        document.getElementById('sourceLang').value = sourceLangObj.code;
        onSourceLangChange();
      }

      const mainTrans = translations.find(t => t.post_id === postId && t.language_id === post.source_language_id) ||
        translations.find(t => t.post_id === postId);
      if (mainTrans) {
        document.getElementById('postTitle').value = mainTrans.title;
        quill.root.innerHTML = mainTrans.content || '';
      }

      translations.filter(t => t.language_id !== post.source_language_id && t.post_id === postId).forEach(t => {
        const l = languages.find(lg => lg.id === t.language_id);
        if (l) {
          const cb = document.querySelector(`#translatePills input[value="${l.code}"]`);
          if (cb) { cb.checked = true; onTranslateToggle(cb); }
        }
      });
    }

    function renderPostWorkflowNotice(post) {
      const notice = document.getElementById('postWorkflowNotice');
      const english = localStorage.getItem('blog-lang') === 'en';
      const config = {
        DRAFT: { icon: 'solar:document-text-bold-duotone', cls: 'draft', vi: 'Bản nháp – bài viết chưa được gửi duyệt.', en: 'Draft – this post has not been submitted for review.' },
        PENDING: { icon: 'solar:clock-circle-bold-duotone', cls: 'pending', vi: 'Bài viết đang chờ Super Admin duyệt.', en: 'This post is awaiting Super Admin review.' },
        REJECTED: { icon: 'solar:close-circle-bold-duotone', cls: 'rejected', vi: 'Bài viết bị từ chối. Hãy chỉnh sửa và gửi duyệt lại.', en: 'This post was rejected. Edit it and submit it for review again.' },
        PUBLISHED: { icon: 'solar:check-circle-bold-duotone', cls: 'published', vi: 'Bài viết đang được xuất bản.', en: 'This post is currently published.' }
      }[post.status];
      if (!config) { notice.hidden = true; return; }
      const safeReason = String(post.rejection_reason || '').replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[char]));
      const reason = post.status === 'REJECTED' && safeReason ? `<small><strong>${english ? 'Reason:' : 'Lý do:'}</strong> ${safeReason}</small>` : '';
      notice.className = `post-workflow-notice ${config.cls}`;
      notice.innerHTML = `<iconify-icon icon="${config.icon}"></iconify-icon><div><span>${english ? config.en : config.vi}</span>${reason}</div>`;
      notice.hidden = false;
    }

    function savePost(requestedStatus) {
      const title = document.getElementById('postTitle').value.trim();
      const content = quill ? quill.root.innerHTML : '';
      const isEmpty = !quill || quill.getText().trim().length === 0;
      const catId = parseInt(document.getElementById('categoryId').value);
      const sourceLangCode = document.getElementById('sourceLang').value;
      const languages = db.get('languages');

      if (!title || isEmpty || !thumbnailData) {
        showToast(localStorage.getItem('blog-lang') === 'en' ? 'Please enter a title, content and post thumbnail.' : 'Vui lòng nhập tiêu đề, nội dung và chọn ảnh đại diện!', 'error'); return;
      }

      const posts = db.get('posts');
      const transDB = db.get('post_translations');
      const user = db.getCurrentUser();
      const existingPost = currentPostId ? posts.find(post => post.id === currentPostId) : null;
      const wasNewPost = !existingPost;
      const previousStatus = existingPost?.status || null;
      const beforePost = existingPost ? JSON.parse(JSON.stringify(existingPost)) : null;
      if (!user || (existingPost && user.role_id !== 1 && existingPost.author_id !== user.id)) {
        showToast(localStorage.getItem('blog-lang') === 'en' ? 'You do not have permission to save this post.' : 'Bạn không có quyền lưu bài viết này!', 'error');
        return;
      }
      const requiresReview = user.role_id !== 1 && getSystemSettings().require_post_approval;
      const status = requestedStatus === 'DRAFT' ? 'DRAFT' : (requiresReview ? 'PENDING' : 'PUBLISHED');
      const now = new Date().toISOString();

      let postId = currentPostId;
      if (!postId) {
        postId = posts.length ? Math.max(...posts.map(p => p.id)) + 1 : 1;
        const sourceLangObj = languages.find(l => l.code === sourceLangCode);
        posts.push({ id: postId, author_id: user.id, category_id: catId, thumbnail: thumbnailData, status, source_language_id: sourceLangObj.id, submitted_at: status === 'PENDING' ? now : null, published_at: status === 'PUBLISHED' ? now : null, created_at: now, updated_at: now });
      } else {
        const p = posts.find(x => x.id === postId);
        if (p) {
          p.category_id = catId;
          p.thumbnail = thumbnailData;
          p.status = status;
          p.updated_at = now;
          if (status === 'PENDING') { p.submitted_at = now; p.rejection_reason = null; p.reviewed_at = null; p.reviewed_by = null; }
          if (status === 'PUBLISHED') { p.published_at = p.published_at || now; p.rejection_reason = null; }
        }
      }
      db.set('posts', posts);

      const sourceLangObj = languages.find(l => l.code === sourceLangCode);
      let sTrans = transDB.find(t => t.post_id === postId && t.language_id === sourceLangObj.id);
      if (sTrans) { sTrans.title = title; sTrans.content = content; }
      else {
        transDB.push({ id: transDB.length ? Math.max(...transDB.map(x => x.id)) + 1 : 1, post_id: postId, language_id: sourceLangObj.id, title, content });
      }

      document.querySelectorAll('#translatePills input:checked').forEach(cb => {
        const lObj = languages.find(l => l.code === cb.value);
        const tTitle = `[${lObj.name}] ${title}`;
        const tContent = `<p><em>(Nội dung được tự động dịch sang ${lObj.name})</em></p>${content}`;
        let eTrans = transDB.find(t => t.post_id === postId && t.language_id === lObj.id);
        if (eTrans) { eTrans.title = tTitle; eTrans.content = tContent; eTrans.is_auto_translated = true; }
        else { transDB.push({ id: transDB.length ? Math.max(...transDB.map(x => x.id)) + 1 : 1, post_id: postId, language_id: lObj.id, title: tTitle, content: tContent, is_auto_translated: true }); }
      });

      db.set('post_translations', transDB);
      const savedPost = posts.find(post => post.id === postId);
      recordAuditLog({
        action: wasNewPost ? 'POST_CREATED' : 'POST_UPDATED',
        entityType: 'POST',
        entityId: postId,
        entityLabel: title,
        beforeData: beforePost,
        afterData: savedPost,
        metadata: { source_language: sourceLangCode, requested_status: requestedStatus }
      });
      if (status === 'PENDING' && previousStatus !== 'PENDING') {
        recordAuditLog({ action: 'POST_SUBMITTED', entityType: 'POST', entityId: postId, entityLabel: title, beforeData: { status: previousStatus }, afterData: { status } });
      }
      const english = localStorage.getItem('blog-lang') === 'en';
      const message = status === 'PUBLISHED'
        ? (english ? 'Post published successfully.' : 'Đã xuất bản bài viết thành công!')
        : status === 'PENDING'
          ? (english ? 'Post submitted for review.' : 'Bài viết đã được gửi và đang chờ duyệt.')
          : (english ? 'Draft saved.' : 'Đã lưu bản nháp!');
      showToast(message, 'success');
      setTimeout(() => window.location.href = 'owner-posts.html', 1200);
    }
  </script>
</body>
