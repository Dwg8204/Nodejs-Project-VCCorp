<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
<link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
<script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>

  <title>Viết bài – Medium</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    .form-main {
      padding: 24px 40px 80px 40px;
      max-width: 760px;
    }

    .form-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .form-header h1 {
      /* font-family: Georgia, 'Times New Roman', serif; */
      font-size: 32px;
      font-weight: 400;
    }

    .form-actions {
      display: flex;
      gap: 10px;
    }

    .lang-row {
      display: flex;
      gap: 16px;
    }

    .lang-row .form-group {
      flex: 1;
    }

    .translate-section {
      border-top: 1px solid var(--border);
      margin-top: 32px;
      padding-top: 24px;
    }

    .translate-section h2 {
      font-size: 18px;
      margin-bottom: 6px;
    }

    .translate-section .desc {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 16px;
      line-height: 1.5;
    }

    /* Quill rich text editor */
    #postContentEditor {
      background: var(--card-bg);
      color: var(--text);
      min-height: 260px;
      font-size: 16px;
      border-bottom-left-radius: 6px;
      border-bottom-right-radius: 6px;
    }
    .ql-toolbar.ql-snow {
      border-color: var(--border-strong) !important;
      border-top-left-radius: 6px;
      border-top-right-radius: 6px;
      background: var(--bg-soft);
    }
    .ql-container.ql-snow { border-color: var(--border-strong) !important; }
    .ql-snow .ql-stroke { stroke: var(--text) !important; }
    .ql-snow .ql-fill { fill: var(--text) !important; }
    .ql-snow .ql-picker { color: var(--text) !important; }
    .ql-snow .ql-picker-options { background: var(--card-bg) !important; }
    .ql-editor.ql-blank::before { color: var(--text-muted) !important; }

    .panel-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 8px;
    }

    /* Preview modal */
    .preview-modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 300;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .preview-modal-overlay.open { display: flex; }
    .preview-modal {
      background: var(--card-bg);
      border-radius: 12px;
      max-width: 640px;
      width: 100%;
      max-height: 85vh;
      overflow-y: auto;
      padding: 32px;
      position: relative;
    }
    .preview-modal .close-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      cursor: pointer;
      font-size: 22px;
      color: var(--text-muted);
    }
    .preview-modal h1 {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 32px;
      margin-bottom: 16px;
      color: var(--text);
    }
    .preview-modal .preview-content {
      font-size: 17px;
      line-height: 1.7;
      color: var(--text);
    }
    .preview-lang-badge {
      display: inline-block;
      font-size: 12px;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 3px 10px;
      border-radius: 10px;
      margin-bottom: 16px;
    }

    .translate-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 8px;
    }

    .translation-panel {
      display: none;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px;
      margin-top: 16px;
    }

    .translation-panel.open {
      display: block;
    }

    .translation-panel .panel-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 15px;
      margin-bottom: 16px;
    }

    .translation-panel .badge-auto {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 400;
      background: var(--bg-pill);
      padding: 2px 8px;
      border-radius: 10px;
    }
  </style>
</head>

<body>

  <div class="topbar">
    <div class="topbar-left">
      <span class="hamburger" onclick="toggleSidebar()"><iconify-icon icon="solar:hamburger-menu-bold-duotone"></iconify-icon></span>
      <a href="index.html" class="logo">Medium</a>
      <div class="search-box"><iconify-icon icon="solar:magnifer-linear"></iconify-icon><input type="text" data-i18n-placeholder="search_placeholder" placeholder="Tìm kiếm bài viết..." onkeydown="handleTopbarSearch(event)"></div>
    </div>
    <div class="topbar-right">
      <div class="lang-dropdown">
        <button class="lang-btn" onclick="toggleLangMenu()"><iconify-icon icon="solar:global-bold-duotone"></iconify-icon> <span class="lang-current-label">Tiếng Việt</span>
          <iconify-icon icon="solar:alt-arrow-down-linear"></iconify-icon></button>
        <div class="lang-menu">
          <a href="#" data-lang="vi" onclick="selectLanguage('vi');return false;">Tiếng Việt</a>
          <a href="#" data-lang="en" onclick="selectLanguage('en');return false;">English</a>
        </div>
      </div>
      <button class="theme-toggle" onclick="toggleTheme()"><span class="knob"><iconify-icon icon="solar:sun-bold"></iconify-icon></span></button>
      <div class="avatar">N</div>
    </div>
  </div>

  <div class="layout no-rail" id="layoutRoot">
        <aside class="sidebar">
      <a href="index.html"><span class="icon"><iconify-icon icon="solar:home-2-bold-duotone"></iconify-icon></span> <span data-i18n="home">Home</span></a>
      <a href="profile.html"><span class="icon"><iconify-icon icon="solar:user-circle-bold-duotone"></iconify-icon></span> <span data-i18n="profile">Profile</span></a>
      <a href="owner-posts.html" class="active"><span class="icon"><iconify-icon icon="solar:document-text-bold-duotone"></iconify-icon></span> <span data-i18n="manage_posts">Manage posts</span></a>
    </aside>

    <main class="form-main">
      <div class="form-header">
        <h1 id="formTitle">Viết bài mới</h1>
        <div class="form-actions">
          <a href="owner-posts.html" class="btn btn-outline" data-i18n="cancel">Hủy</a>
          <button class="btn btn-outline" onclick="openPreviewPicker()" data-i18n="preview"><iconify-icon icon="solar:eye-bold-duotone" style="margin-right:4px;"></iconify-icon>Xem trước</button>
          <button class="btn btn-outline" onclick="savePost('DRAFT')" data-i18n="save_draft">Lưu nháp</button>
          <button class="btn btn-primary" onclick="savePost('PUBLISHED')" data-i18n="publish">Xuất bản</button>
        </div>
      </div>

      <form onsubmit="return false;">
        <div class="lang-row">
          <div class="form-group">
            <label>Ngôn ngữ của bài viết</label>
            <select class="form-control" id="sourceLang" onchange="onSourceLangChange()">
              <!-- Rendered by js -->
            </select>
          </div>
          <div class="form-group">
            <label>Danh mục</label>
            <select class="form-control" id="categoryId">
              <!-- Rendered by js -->
            </select>
          </div>
        </div>

        <div class="form-group">
          <label>Tên bài viết</label>
          <input type="text" id="postTitle" class="form-control" placeholder="Nhập tiêu đề bài viết...">
        </div>

        <div class="form-group">
          <label>Nội dung bài viết</label>
          <div id="postContentEditor"></div>
        </div>

        <div class="translate-section">
          <h2>Dịch bài viết sang ngôn ngữ khác</h2>
          <div class="desc">Chọn các ngôn ngữ bạn muốn dịch bài viết này sang. Với mỗi ngôn ngữ được chọn, hãy nhập tiêu
            đề và nội dung tương ứng bên dưới.</div>

          <div class="translate-pills" id="translatePills">
            <!-- Rendered by js -->
          </div>
        </div>
      </form>
    </main>
  </div>

  <div class="preview-modal-overlay" id="previewModalOverlay" onclick="if(event.target===this) closePreviewModal()">
    <div class="preview-modal">
      <iconify-icon icon="solar:close-circle-bold-duotone" class="close-btn" onclick="closePreviewModal()"></iconify-icon>
      <span class="preview-lang-badge" id="previewLangBadge">English</span>
      <h1 id="previewTitle">Tiêu đề</h1>
      <div class="preview-content" id="previewContent"></div>
    </div>
  </div>

  <script src="shared.js"></script>
  <script src="js/mockData.js"></script>
  <script>
    let LANG_NAMES = {};
    let currentPostId = null;
    let quill = null;

    window.addEventListener('DOMContentLoaded', () => {
      const user = db.getCurrentUser();
      if (!user || user.role_id === 3) {
        alert('Vui lòng đăng nhập với tài khoản hợp lệ!');
        window.location.href = 'login.html';
        return;
      }

      // Khởi tạo trình soạn thảo rich text
      quill = new Quill('#postContentEditor', {
        theme: 'snow',
        placeholder: 'Viết nội dung ở đây...',
        modules: {
          toolbar: [
            [{ header: [2, 3, false] }],
            ['bold', 'italic', 'underline', 'strike'],
            ['blockquote', 'code-block'],
            [{ list: 'ordered' }, { list: 'bullet' }],
            ['link', 'image'],
            ['clean']
          ]
        }
      });

      const languages = db.get('languages');
      const categories = db.get('categories');
      const categoryTranslations = db.get('category_translation');
      const langId = localStorage.getItem('current_language_id') || '1';

      // Build Lang options
      let langOptionsHtml = '';
      let pillsHtml = '';
      languages.forEach(l => {
        LANG_NAMES[l.code] = l.name;
        langOptionsHtml += `<option value="${l.code}">${l.name}</option>`;
        pillsHtml += `
        <label class="checkbox-pill" data-lang="${l.code}">
          <input type="checkbox" value="${l.code}" onchange="onTranslateToggle(this)"> ${l.name}
          <iconify-icon icon="solar:eye-bold-duotone" class="preview-eye" style="display:none; margin-left:4px;" onclick="event.preventDefault(); previewTranslation('${l.code}')"></iconify-icon>
        </label>
      `;
      });
      document.getElementById('sourceLang').innerHTML = langOptionsHtml;
      document.getElementById('translatePills').innerHTML = pillsHtml;

      // Build categories
      let catOptionsHtml = '';
      categories.forEach(c => {
        let t = categoryTranslations.find(x => x.category_id === c.id && x.language_id == langId);
        if (!t) t = categoryTranslations.find(x => x.category_id === c.id);
        catOptionsHtml += `<option value="${c.id}">${t ? t.name : 'Unknown'}</option>`;
      });
      document.getElementById('categoryId').innerHTML = catOptionsHtml;

      onSourceLangChange();

      // Init Edit mode
      const params = new URLSearchParams(window.location.search);
      if (params.get('id')) {
        document.getElementById('formTitle').textContent = 'Chỉnh sửa bài viết';
        currentPostId = parseInt(params.get('id'));
        loadPostData(currentPostId);
      }
    });

    function onSourceLangChange() {
      const source = document.getElementById('sourceLang').value;
      document.querySelectorAll('#translatePills .checkbox-pill').forEach(pill => {
        const isSource = pill.dataset.lang === source;
        pill.style.display = isSource ? 'none' : 'inline-flex';
        if (isSource) {
          const cb = pill.querySelector('input');
          if (cb.checked) { cb.checked = false; onTranslateToggle(cb); }
        }
      });
    }

    function openPreviewPicker() {
      const sourceLang = document.getElementById('sourceLang').value;
      const sourceLangObj = (db.get('languages')).find(l => l.code === sourceLang);
      const checkedLangs = [...document.querySelectorAll('#translatePills input:checked')].map(cb => cb.value);

      const options = [{ code: sourceLang, label: `${sourceLangObj ? sourceLangObj.name : sourceLang} (bản gốc)` }]
        .concat(checkedLangs.map(code => ({ code, label: LANG_NAMES[code] || code })));

      if (options.length === 1) {
        previewLanguage(options[0].code, true);
        return;
      }

      openFormModal({
        title: 'Chọn ngôn ngữ cần xem trước',
        submitLabel: 'Xem trước',
        fields: [{ name: 'lang', label: 'Ngôn ngữ', type: 'select', options: options.map(o => ({ value: o.code, label: o.label })) }],
        onSubmit: (values) => {
          previewLanguage(values.lang, values.lang === sourceLang);
        }
      });
    }

    function previewLanguage(langCode, isSource) {
      if (isSource) {
        const title = document.getElementById('postTitle').value || '(Chưa có tiêu đề)';
        const content = quill ? quill.root.innerHTML : '';
        const lobj = (db.get('languages')).find(l => l.code === langCode);
        showPreviewModal(title, content, lobj ? lobj.name : langCode);
      } else {
        previewTranslation(langCode);
      }
    }

    function onTranslateToggle(checkbox) {
      const pill = checkbox.closest('.checkbox-pill');
      pill.classList.toggle('active', checkbox.checked);
      const eye = pill.querySelector('.preview-eye');
      if (eye) eye.style.display = checkbox.checked ? 'inline-flex' : 'none';
    }

    function previewTranslation(langCode) {
      const lobj = (db.get('languages')).find(l => l.code === langCode);
      const title = document.getElementById('postTitle').value || '(Chưa có tiêu đề)';
      const content = quill ? quill.root.innerHTML : '';
      // Giả lập bản dịch tự động — thực tế sẽ gọi API dịch thuật
      const tTitle = `[${lobj.name}] ${title}`;
      const tContent = `<p><em>(Bản xem trước — nội dung tự động dịch sang ${lobj.name})</em></p>${content}`;
      showPreviewModal(tTitle, tContent, lobj.name);
    }

    function showPreviewModal(title, content, langName) {
      document.getElementById('previewLangBadge').textContent = langName;
      document.getElementById('previewTitle').textContent = title;
      document.getElementById('previewContent').innerHTML = content;
      document.getElementById('previewModalOverlay').classList.add('open');
    }
    function closePreviewModal() {
      document.getElementById('previewModalOverlay').classList.remove('open');
    }

    function loadPostData(postId) {
      const posts = db.get('posts');
      const translations = db.get('post_translations');
      const languages = db.get('languages');

      const post = posts.find(p => p.id === postId);
      if (!post) return;

      document.getElementById('categoryId').value = post.category_id;
      // Tìm language gốc dựa trên translation đầu tiên
      const mainTrans = translations.find(t => t.post_id === postId);
      if (mainTrans) {
        const l = languages.find(lang => lang.id === mainTrans.language_id);
        if (l) {
          document.getElementById('sourceLang').value = l.code;
          onSourceLangChange();
          document.getElementById('postTitle').value = mainTrans.title;
          quill.root.innerHTML = mainTrans.content || '';
        }
      }

      // Load other translations (giả định)
      translations.filter(t => t.id !== (mainTrans ? mainTrans.id : null)).forEach(t => {
        const l = languages.find(lang => lang.id === t.language_id);
        if (l && l.code !== document.getElementById('sourceLang').value) {
          const cb = document.querySelector(`#translatePills input[value="${l.code}"]`);
          if (cb) {
            cb.checked = true;
            onTranslateToggle(cb);
          }
        }
      });
    }

    function savePost(status) {
      const title = document.getElementById('postTitle').value;
      const content = quill ? quill.root.innerHTML : '';
      const isEmpty = !quill || quill.getText().trim().length === 0;
      const catId = parseInt(document.getElementById('categoryId').value);
      const sourceLangCode = document.getElementById('sourceLang').value;
      const languages = db.get('languages');

      if (!title || isEmpty) {
        alert("Vui lòng nhập tiêu đề và nội dung."); return;
      }

      const posts = db.get('posts');
      const transDB = db.get('post_translations');
      const user = db.getCurrentUser();

      let postId = currentPostId;
      if (!postId) {
        postId = posts.length ? Math.max(...posts.map(p => p.id)) + 1 : 1;
        const sourceLangObj = languages.find(l => l.code === sourceLangCode);
        posts.push({
          id: postId,
          author_id: user.id,
          category_id: catId,
          status: status,
          source_language_id: sourceLangObj.id,
          created_at: new Date().toISOString(),
          updated_at: new Date().toISOString()
        });
      } else {
        const p = posts.find(x => x.id === postId);
        p.category_id = catId;
        p.status = status;
        p.updated_at = new Date().toISOString();
      }
      db.set('posts', posts);

      // Save translation (source lang)
      const sourceLangObj = languages.find(l => l.code === sourceLangCode);
      let sTrans = transDB.find(t => t.post_id === postId && t.language_id === sourceLangObj.id);
      if (sTrans) {
        sTrans.title = title;
        sTrans.content = content;
      } else {
        const tId = transDB.length ? Math.max(...transDB.map(x => x.id)) + 1 : 1;
        transDB.push({
          id: tId, post_id: postId, language_id: sourceLangObj.id,
          title: title, content: content
        });
      }

      // Handle other checked translations (simulate auto-translation)
      document.querySelectorAll('#translatePills input:checked').forEach(cb => {
        const lcode = cb.value;
        const lobj = languages.find(l => l.code === lcode);

        // Auto-translated fake data
        const tTitle = `[${lobj.name}] ${title}`;
        const tContent = `<p><em>(Nội dung được tự động dịch sang ${lobj.name})</em></p>${content}`;

        let eTrans = transDB.find(t => t.post_id === postId && t.language_id === lobj.id);
        if (eTrans) {
          eTrans.title = tTitle;
          eTrans.content = tContent;
          eTrans.is_auto_translated = true;
        } else {
          const ntId = transDB.length ? Math.max(...transDB.map(x => x.id)) + 1 : 1;
          transDB.push({
            id: ntId, post_id: postId, language_id: lobj.id,
            title: tTitle, content: tContent,
            is_auto_translated: true
          });
        }
      });

      db.set('post_translations', transDB);
      alert(status === 'PUBLISHED' ? 'Đã xuất bản!' : 'Đã lưu bản nháp!');
      window.location.href = 'owner-posts.html';
    }
  </script>
</body>

</html>
