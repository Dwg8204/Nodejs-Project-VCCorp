<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>

<title>Tenney Balogun – Medium</title>
<link rel="stylesheet" href="shared.css">
<style>
  .profile-main { padding: 24px 40px; }
  .profile-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .profile-header h1 {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 42px;
    font-weight: 400;
  }
  .more-icon { font-size: 20px; color: var(--text-muted); cursor: pointer; }

  .profile-tabs {
    display: flex;
    gap: 24px;
    border-bottom: 1px solid var(--border);
    margin: 24px 0 8px 0;
  }
  .profile-tabs a {
    padding: 12px 0;
    font-size: 15px;
    color: var(--text-muted);
    border-bottom: 2px solid transparent;
  }
  .profile-tabs a.active {
    color: var(--text);
    font-weight: 600;
    border-bottom: 2px solid var(--text);
  }

  .pinned-tag {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: var(--text-muted);
    margin-top: 24px;
  }
  .post-item {
    padding: 12px 0 24px 0;
    border-bottom: 1px solid var(--border);
  }
  .post-author-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--text-muted);
    margin: 6px 0 10px 0;
  }
  .post-author-row .mini-avatar {
    width: 22px; height: 22px; border-radius: 50%; background: #999;
  }
  .post-body {
    display: flex;
    justify-content: space-between;
    gap: 24px;
  }
  .post-text { flex: 1; }
  .post-title {
    font-size: 22px;
    font-weight: 700;
    line-height: 1.3;
    margin-bottom: 6px;
    cursor: pointer;
  }
  .post-title:hover { text-decoration: underline; }
  .post-desc {
    font-size: 16px;
    color: var(--text-muted);
    margin-bottom: 14px;
  }
  .post-thumb {
    width: 160px;
    height: 110px;
    border-radius: 6px;
    background-size: cover;
    background-position: center;
    flex-shrink: 0;
    cursor: pointer;
  }
  .post-meta {
    display: flex;
    align-items: center;
    gap: 20px;
    color: var(--text-muted);
    font-size: 14px;
  }
  .post-meta .spacer { flex: 1; }

  /* Right rail: profile card */
  .profile-card { padding: 24px 20px; }
  .profile-card .big-avatar {
    width: 80px; height: 80px; border-radius: 50%;
    background-image: url('https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=200');
    background-size: cover;
    margin-bottom: 16px;
  }
  .profile-card h2 {
    font-size: 20px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .profile-card .pronoun {
    font-size: 13px;
    color: var(--text-muted);
    font-weight: 400;
  }
  .profile-card .followers {
    font-size: 14px;
    color: var(--text-muted);
    margin: 6px 0 12px 0;
  }
  .profile-card .bio {
    font-size: 14px;
    color: var(--accent);
    line-height: 1.5;
    margin-bottom: 16px;
  }
  .profile-card .follow-btn-big {
    background: var(--text);
    color: var(--bg);
    border: none;
    padding: 10px 20px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    margin-bottom: 24px;
  }
  .profile-card h3 { font-size: 16px; margin-bottom: 12px; }
  .following-item {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
    margin-bottom: 12px;
  }
  .following-item .f-avatar {
    width: 28px; height: 28px; border-radius: 4px; background: #ccc;
  }
  .following-item .f-name { flex: 1; }
  .following-item .more-dots { color: var(--text-muted); cursor: pointer; }
  .see-all { font-size: 14px; color: var(--text-muted); margin-top: 8px; }
</style>
</head>
<body>

<!-- ===== Topbar (kế thừa) ===== -->
<div class="topbar">
  <div class="topbar-left">
    <span class="hamburger" onclick="toggleSidebar()"><iconify-icon icon="solar:hamburger-menu-bold-duotone"></iconify-icon></span>
    <a href="index.html" class="logo">Medium</a>
    <div class="search-box"><iconify-icon icon="solar:magnifer-linear"></iconify-icon><input type="text" data-i18n-placeholder="search_placeholder" placeholder="Tìm kiếm bài viết..." onkeydown="handleTopbarSearch(event)"></div>
  </div>
  <div class="topbar-right">
    <div class="lang-dropdown">
      <button class="lang-btn" onclick="toggleLangMenu()"><iconify-icon icon="solar:global-bold-duotone"></iconify-icon> <span class="lang-current-label">Tiếng Việt</span> <iconify-icon icon="solar:alt-arrow-down-linear"></iconify-icon></button>
      <div class="lang-menu">
        <a href="#" data-lang="vi" onclick="selectLanguage('vi');return false;">Tiếng Việt</a>
        <a href="#" data-lang="en" onclick="selectLanguage('en');return false;">English</a>
      </div>
    </div>
    <button class="theme-toggle" onclick="toggleTheme()"><span class="knob"><iconify-icon icon="solar:sun-bold"></iconify-icon></span></button>
    <div class="avatar">N</div>
  </div>
</div>

<div class="layout" id="layoutRoot">
  <!-- ===== Sidebar (kế thừa) ===== -->
        <aside class="sidebar" id="mainSidebar">
    <a href="index.html"><span class="icon"><iconify-icon icon="solar:home-2-bold-duotone"></iconify-icon></span> <span data-i18n="home">Home</span></a>
    <a href="profile.html"><span class="icon"><iconify-icon icon="solar:user-circle-bold-duotone"></iconify-icon></span> <span data-i18n="profile">Profile</span></a>
    <a href="owner-posts.html" data-role-link="2" style="display:none;"><span class="icon"><iconify-icon icon="solar:document-text-bold-duotone"></iconify-icon></span> <span data-i18n="manage_posts">Manage posts</span></a>
    <a href="admin/index.html" data-role-link="1" style="display:none;"><span class="icon"><iconify-icon icon="solar:chart-2-bold-duotone"></iconify-icon></span> <span data-i18n="admin_dashboard">Admin dashboard</span></a>
  </aside>

  <!-- ===== Profile main ===== -->
  <main class="profile-main">
    <div class="profile-header">
      <h1 id="profile-name">Tenney Balogun</h1>
      <span class="more-icon"><iconify-icon icon="solar:menu-dots-bold"></iconify-icon></span>
    </div>

    <div class="profile-tabs">
      <a href="#" class="active">Home</a>
      <a href="#">Activity</a>
      <a href="#">About</a>
    </div>

    <div id="profile-posts-container">
      <!-- Rendered by js -->
    </div>
  </main>

  <!-- ===== Right rail: profile card ===== -->
  <aside class="right-rail profile-card">
    <div class="big-avatar" id="profile-avatar" data-fallback-bg="1"></div>
    <h2><span id="profile-card-name">Tenney Balogun</span> <span class="pronoun">she/her</span></h2>
    <div class="followers">58 followers</div>
    <div class="bio" id="profile-bio">Sports Writer | Poet | Lyricist | Copy Writer | Professional Writer</div>
    <button class="follow-btn-big">Follow</button>

    <h3>Following</h3>
    <div class="following-item">
      <span class="f-avatar"></span>
      <span class="f-name">Nafisa Atiku</span>
      <span class="more-dots"><iconify-icon icon="solar:menu-dots-bold"></iconify-icon></span>
    </div>
    <div class="following-item">
      <span class="f-avatar"></span>
      <span class="f-name">Kuby Idem</span>
      <span class="more-dots"><iconify-icon icon="solar:menu-dots-bold"></iconify-icon></span>
    </div>
    <div class="following-item">
      <span class="f-avatar"></span>
      <span class="f-name">Live View</span>
      <span class="more-dots"><iconify-icon icon="solar:menu-dots-bold"></iconify-icon></span>
    </div>
    <div class="following-item">
      <span class="f-avatar"></span>
      <span class="f-name">Runner's Life</span>
      <span class="more-dots"><iconify-icon icon="solar:menu-dots-bold"></iconify-icon></span>
    </div>
    <div class="following-item">
      <span class="f-avatar"></span>
      <span class="f-name">Paper Poetry</span>
      <span class="more-dots"><iconify-icon icon="solar:menu-dots-bold"></iconify-icon></span>
    </div>
    <div class="see-all">See all (19)</div>
  </aside>
</div>

<script src="js/mockData.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    // Topbar Auth logic
    const currentUser = db.getCurrentUser();
    if (!currentUser) {
      const topbarRight = document.querySelector('.topbar-right');
      topbarRight.innerHTML = `
        <a href="login.html" style="margin-right:15px; color:var(--text-muted); text-decoration:none;" data-i18n="sign_in">Sign In</a>
        <a href="register.html" style="background:var(--text); color:var(--bg); padding:8px 16px; border-radius:20px; text-decoration:none;" data-i18n="get_started">Get Started</a>
      `;
      applyLanguage(localStorage.getItem('blog-lang') || 'vi');
    }

    const params = new URLSearchParams(window.location.search);
    let targetUserId = params.get('id');
    const users = db.get('users');
    let targetUser = null;

    if (targetUserId) {
      targetUser = users.find(u => u.id === parseInt(targetUserId));
    } else {
      targetUser = currentUser || users[0];
    }

    if (!targetUser) {
      document.querySelector('.profile-main').innerHTML = '<p>Người dùng không tồn tại.</p>';
      return;
    }

    const name = targetUser.full_name || targetUser.user_name || 'Anonymous';
    document.getElementById('profile-name').textContent = name;
    document.getElementById('profile-card-name').textContent = name;
    document.getElementById('profile-bio').textContent = targetUser.bio || 'Chưa có thông tin giới thiệu.';
    document.title = name + ' – Medium';
    
    document.getElementById('profile-avatar').style.backgroundImage = `url('https://api.dicebear.com/7.x/avataaars/svg?seed=${name}')`;
    applyBgFallback();

    const langId = localStorage.getItem('current_language_id') || '1';
    const allPosts = db.getPostsWithDetails(langId).filter(post => {
      const translations = db.get('post_translations');
      return translations.some(t => t.post_id === post.id && String(t.language_id) === String(langId));
    });
    const userPosts = allPosts.filter(p => p.author_id === targetUser.id);

    let html = '';
    userPosts.forEach(post => {
      const tempDiv = document.createElement('div');
      tempDiv.innerHTML = post.content;
      const snippet = tempDiv.textContent || tempDiv.innerText || "";
      const shortDesc = snippet.length > 100 ? snippet.substring(0, 100) + '...' : snippet;
      const imgUrl = `https://images.unsplash.com/photo-${1441974231531 + post.id}-c6227db76b6e?w=400`;

      html += `
        <div class="post-item">
          <div class="post-author-row">
            <span class="mini-avatar" data-fallback-bg="1" style="background-image:url('https://api.dicebear.com/7.x/avataaars/svg?seed=${name}'); background-size:cover;"></span> ${name} &nbsp;&middot;&nbsp; ${post.date_formatted}
          </div>
          <div class="post-body">
            <div class="post-text">
              <a href="article.html?id=${post.id}"><div class="post-title">${post.title}</div></a>
              <div class="post-desc">${shortDesc}</div>
              <div class="post-meta">
                <span class="like-btn ${isPostLiked(post.id) ? 'liked' : ''}" onclick="toggleLike(${post.id}, this)"><iconify-icon icon="solar:heart-bold-duotone"></iconify-icon> <span class="like-count">${post.likes}</span></span>
                <span class="comment-btn" onclick="location.href='article.html?id=${post.id}'"><iconify-icon icon="solar:chat-round-dots-bold-duotone"></iconify-icon> ${post.comments}</span>
                <span class="spacer"></span>
                <span class="bookmark-btn ${isPostBookmarked(post.id) ? 'active' : ''}" onclick="toggleBookmark(${post.id}, this)"><iconify-icon icon="solar:bookmark-bold-duotone"></iconify-icon></span>
                <span><iconify-icon icon="solar:menu-dots-bold"></iconify-icon></span>
              </div>
            </div>
            <a href="article.html?id=${post.id}">
              <div class="post-thumb" data-fallback-bg="1" style="background-image:url('${imgUrl}');"></div>
            </a>
          </div>
        </div>
      `;
    });

    if (userPosts.length === 0) {
      html = '<p style="color:var(--text-muted); margin-top:24px;">Chưa có bài viết nào.</p>';
    }
    
    document.getElementById('profile-posts-container').innerHTML = html;
    applyBgFallback();
  });
</script>
<script src="shared.js"></script>
</body>
</html>
