<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>

<title>Đăng ký – Medium</title>
<link rel="stylesheet" href="shared.css">
<style>
  .auth-topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 32px;
    border-bottom: 1px solid var(--border);
  }
  .auth-wrapper {
    max-width: 380px;
    margin: 60px auto;
    padding: 0 20px;
  }
  .auth-wrapper h1 {
    font-family: inherit;
    font-size: 32px;
    font-weight: 400;
    text-align: center;
    margin-bottom: 32px;
  }
  .social-btn {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    border: 1px solid var(--border-strong);
    border-radius: 24px;
    padding: 12px;
    font-size: 15px;
    background: var(--card-bg);
    color: var(--text);
    cursor: pointer;
    margin-bottom: 12px;
  }
  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    color: var(--text-muted);
    font-size: 13px;
    margin: 24px 0;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }
  .btn-primary-block {
    width: 100%;
    background: var(--text);
    color: var(--bg);
    border: none;
    border-radius: 24px;
    padding: 12px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  .auth-footer-text {
    text-align: center;
    font-size: 14px;
    color: var(--text-muted);
    margin-top: 24px;
  }
  .auth-footer-text a { color: var(--accent); font-weight: 600; }
  .terms-text {
    font-size: 12px;
    color: var(--text-muted);
    text-align: center;
    margin-top: 16px;
    line-height: 1.5;
  }
</style>
</head>
<body>

<div class="auth-topbar">
  <a href="index.html" class="logo">Medium</a>
  <div style="display:flex; align-items:center; gap:16px;">
    <button class="theme-toggle" onclick="toggleTheme()"><span class="knob"><iconify-icon icon="solar:sun-bold"></iconify-icon></span></button>
    <span style="font-size:14px; color:var(--text-muted);">Đã có tài khoản?</span>
    <a href="login.html" class="btn" style="border:1px solid var(--text); color:var(--text); padding:8px 18px;">Đăng nhập</a>
  </div>
</div>

<div class="auth-wrapper">
  <h1>Tạo tài khoản</h1>

  <button class="social-btn"><iconify-icon icon="flat-color-icons:google"></iconify-icon> Đăng ký với Google</button>
  <button class="social-btn"><iconify-icon icon="logos:facebook"></iconify-icon> Đăng ký với Facebook</button>

  <div class="divider">hoặc</div>

  <form id="registerForm">
    <div class="form-group">
      <label>Họ và tên</label>
      <input type="text" id="fullname" class="form-control" placeholder="Nguyễn Văn A" required>
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="email" class="form-control" placeholder="you@example.com" required>
    </div>
    <div class="form-group">
      <label>Mật khẩu</label>
      <input type="password" id="password" class="form-control" placeholder="Tối thiểu 8 ký tự" required>
    </div>
    <button type="submit" class="btn-primary-block">Đăng ký</button>
  </form>

  <div class="terms-text">
    Bằng việc đăng ký, bạn đồng ý với Điều khoản dịch vụ và Chính sách bảo mật của chúng tôi.
  </div>

  <div class="auth-footer-text">
    Đã có tài khoản? <a href="login.html">Đăng nhập</a>
  </div>
</div>

<script src="shared.js"></script>
<script src="js/mockData.js"></script>
<script>
  document.getElementById('registerForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const fullname = document.getElementById('fullname').value;
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    
    const users = db.get('users');
    if (users.find(u => u.email === email)) {
      alert('Email này đã được sử dụng!');
      return;
    }
    
    // Tạo user mới, mặc định là AUTHENTICATED_USER (role_id = 3)
    const newUser = {
      id: users.length ? Math.max(...users.map(u => u.id)) + 1 : 1,
      user_name: email.split('@')[0],
      email: email,
      full_name: fullname,
      is_active: true,
      password_hash: password, // mock plain text password
      email_verified: false,
      role_id: 3,
      otp_code: null,
      otp_created_at: null,
      otp_ttl_seconds: 180,
      created_at: new Date().toISOString(),
      updated_at: new Date().toISOString()
    };
    
    users.push(newUser);
    db.set('users', users);
    
    // Auto login
    localStorage.setItem('current_user', JSON.stringify(newUser));
    alert('Đăng ký thành công!');
    window.location.href = 'index.html';
  });
</script>
</body>
</html>
