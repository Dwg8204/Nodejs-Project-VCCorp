<header class="topbar">
  <div class="container topbar__inner">
    <a class="brand" routerLink="/" aria-label="Về trang chủ VCCorp Blog">
      <span class="brand__mark" aria-hidden="true">V</span>
      <span>VCCorp Blog</span>
    </a>

    <nav class="desktop-nav" aria-label="Điều hướng chính">
      <a routerLink="/">{{ 'posts' | translate }}</a>
      <a routerLink="/admin">{{ 'admin' | translate }}</a>
    </nav>

    <div class="topbar__actions">
      <button
        class="language-button"
        type="button"
        [attr.aria-label]="'changeLanguage' | translate"
        (click)="language.toggleLocale()"
      >{{ language.locale().toUpperCase() }}</button>
      <a class="button button--primary desktop-action" routerLink="/">{{ 'writePost' | translate }}</a>
      <button
        class="menu-button"
        type="button"
        [attr.aria-label]="(menuOpen() ? 'closeMenu' : 'openMenu') | translate"
        [attr.aria-expanded]="menuOpen()"
        (click)="toggleMenu()"
      >
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>

  @if (menuOpen()) {
    <nav class="mobile-nav" aria-label="Điều hướng mobile">
      <a routerLink="/" (click)="toggleMenu()">{{ 'posts' | translate }}</a>
      <a routerLink="/admin" (click)="toggleMenu()">{{ 'admin' | translate }}</a>
    </nav>
  }
</header>

<main>
  <router-outlet />
</main>
