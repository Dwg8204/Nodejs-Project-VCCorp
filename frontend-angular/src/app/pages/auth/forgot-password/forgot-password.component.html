<div class="auth-topbar"><a routerLink="/" class="logo">Medium</a><button class="theme-toggle" type="button"><span class="knob"><iconify-icon icon="solar:sun-bold"></iconify-icon></span></button></div>
<div class="auth-wrapper">
  <a routerLink="/login" class="back-link"><iconify-icon icon="solar:arrow-left-linear"></iconify-icon> {{ copy().back }}</a>
  <h1>{{ copy().title }}</h1><div class="desc">{{ copy().subtitle }}</div>
  @if (!submitted()) { <form [formGroup]="form" (ngSubmit)="submit()"><div class="form-group"><label for="recovery-email">Email</label><input id="recovery-email" type="email" class="form-control" formControlName="email" placeholder="you@example.com">@if(form.controls.email.touched&&form.controls.email.invalid){<span class="field-error">{{ copy().invalid }}</span>}</div><button type="submit" class="btn-primary-block">{{ copy().submit }}</button></form> }
  @else { <div class="success-box"><iconify-icon icon="solar:check-circle-bold-duotone"></iconify-icon> {{ copy().success }}</div> }
</div>
