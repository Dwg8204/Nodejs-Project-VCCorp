<section class="auth-shell"><div class="auth-card">
  <header class="auth-heading"><p class="eyebrow">{{ copy().eyebrow }}</p><h1>{{ copy().title }}</h1><p>{{ copy().subtitle }}</p></header>
  @if (submitted()) { <div class="alert alert--success" role="status">{{ copy().success }}</div><p class="mock-note">{{ copy().mock }}</p> }
  @else { <form class="form-stack" [formGroup]="form" (ngSubmit)="submit()"><div class="field"><label for="recovery-email">Email</label><input id="recovery-email" type="email" formControlName="email" autocomplete="email" placeholder="you@example.com">@if (form.controls.email.touched && form.controls.email.invalid) { <p class="field-error">{{ copy().invalid }}</p> }</div><button class="submit-button" type="submit">{{ copy().submit }}</button></form> }
  <p class="auth-footer"><a class="text-link" routerLink="/login">← {{ copy().back }}</a></p>
</div></section>
