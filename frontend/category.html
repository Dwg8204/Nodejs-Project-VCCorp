<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <title>Category – Medium</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    .category-main {
      padding: 24px 40px;
    }

    .category-main h1 {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 36px;
      font-weight: 400;
      margin-bottom: 20px;
    }

    .category-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 32px;
    }

    .category-pill {
      border: 1px solid #E5E5E5;
      border-radius: 18px;
      padding: 8px 18px;
      font-size: 14px;
      color: #242424;
      background: none;
      cursor: pointer;
    }

    .category-pill.active {
      background: #242424;
      color: #fff;
      border-color: #242424;
    }

    .category-pill:hover:not(.active) {
      border-color: #242424;
    }

    .section-title {
      font-size: 15px;
      color: #6B6B6B;
      margin-bottom: 16px;
    }

    .article-card {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      padding: 28px 0;
      border-bottom: 1px solid #F2F2F2;
    }

    .article-main {
      flex: 1;
      min-width: 0;
    }

    .article-source {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: #6B6B6B;
      margin-bottom: 8px;
    }

    .source-badge {
      width: 20px;
      height: 20px;
      border-radius: 4px;
      background: linear-gradient(135deg, #7C5CE0, #4A90E2);
      display: inline-block;
    }

    .article-title {
      font-size: 22px;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 6px;
      cursor: pointer;
    }

    .article-title:hover {
      text-decoration: underline;
    }

    .article-desc {
      font-size: 16px;
      color: #6B6B6B;
      margin-bottom: 14px;
    }

    .article-meta {
      display: flex;
      align-items: center;
      gap: 20px;
      color: #6B6B6B;
      font-size: 14px;
    }

    .article-meta .spacer {
      flex: 1;
    }

    .article-thumb {
      width: 160px;
      height: 110px;
      border-radius: 6px;
      background-size: cover;
      background-position: center;
      flex-shrink: 0;
      cursor: pointer;
    }

    .category-tag {
      display: inline-block;
      font-size: 12px;
      color: #1a8917;
      background: #E8F5E9;
      padding: 3px 10px;
      border-radius: 12px;
      margin-bottom: 8px;
    }

    .empty-state {
      padding: 60px 0;
      text-align: center;
      color: #6B6B6B;
      font-size: 16px;
    }
  </style>
</head>

<body>

  <!-- ===== Topbar (kế thừa) ===== -->
  <div class="topbar">
    <div class="topbar-left">
      <span class="hamburger" onclick="toggleSidebar()">&#9776;</span>
      <a href="index.html" class="logo">Medium</a>
      <div class="search-box">&#128269; <span>Search</span></div>
    </div>
    <div class="topbar-right">
      <button class="btn-getapp">&#9638; Get app</button>
      <span class="write-link">&#9998; Write</span>
      <div class="lang-dropdown">
        <button class="lang-btn" onclick="toggleLangMenu()">&#127760; <span class="lang-current-label">Tiếng Việt</span>
          &#9662;</button>
        <div class="lang-menu">
          <a href="#" data-lang="vi" onclick="selectLanguage('vi');return false;">Tiếng Việt</a>
          <a href="#" data-lang="en" onclick="selectLanguage('en');return false;">English</a>
        </div>
      </div>
      <button class="theme-toggle" onclick="toggleTheme()"><span class="knob">&#9728;</span></button>
      <span class="icon-btn">&#128276;</span>
      <div class="avatar">N</div>
    </div>
  </div>

  <div class="layout" id="layoutRoot">
    <!-- ===== Sidebar (Library đã thay bằng Category) ===== -->
    <aside class="sidebar">
      <a href="index.html"><span class="icon">&#8962;</span> Home</a>
      <a href="category.html" class="active"><span class="icon">&#128193;</span> Category</a>
      <a href="profile.html"><span class="icon">&#128100;</span> Profile</a>
      <!-- <a href="#"><span class="icon">&#128221;</span> Stories</a>
      <a href="#"><span class="icon">&#128202;</span> Stats</a> -->
      <hr>
      <a href="#"><span class="icon">&#128101;</span> Following</a>
      <div class="follow-box">
        Find writers and publications to follow.
        <br><span class="see-suggestions">See suggestions</span>
      </div>
    </aside>

    <!-- ===== Main: category filter + articles ===== -->
    <main class="category-main">
      <h1>Categories</h1>

      <div class="category-pills" id="categoryPills">
        <button class="category-pill active" data-cat="all">All</button>
        <!-- Rendered by js -->
      </div>

      <div class="section-title" id="sectionTitle">Bài viết mới nhất</div>

      <div id="articleList">
        <!-- Rendered by js -->
      </div>

      <div class="empty-state" id="emptyState" style="display:none;">
        Không có bài viết nào trong danh mục này.
      </div>
    </main>
  </div>

  <script src="js/mockData.js"></script>
  <script>
    let pills = [];
    let cards = [];
    const sectionTitle = document.getElementById('sectionTitle');
    const emptyState = document.getElementById('emptyState');

    document.addEventListener('DOMContentLoaded', () => {
      // Auth logic
      const currentUser = db.getCurrentUser();
      if (!currentUser) {
        const topbarRight = document.querySelector('.topbar-right');
        topbarRight.innerHTML = `
        <a href="login.html" style="margin-right:15px; color:#6B6B6B; text-decoration:none;">Sign In</a>
        <a href="register.html" style="background:#242424; color:#fff; padding:8px 16px; border-radius:20px; text-decoration:none;">Get Started</a>
      `;
      }

      const langId = localStorage.getItem('current_language_id') || '1';

      // Render Categories
      const categories = db.get('categories');
      const categoryTranslations = db.get('category_translation');
      let pillsHtml = '<button class="category-pill active" data-cat="all">All</button>';
      categories.forEach(c => {
        let t = categoryTranslations.find(x => x.category_id === c.id && x.language_id == langId);
        if (!t) t = categoryTranslations.find(x => x.category_id === c.id);
        if (t) {
          pillsHtml += `<button class="category-pill" data-cat="${c.id}">${t.name}</button>`;
        }
      });
      document.getElementById('categoryPills').innerHTML = pillsHtml;

      // Render Posts
      const posts = db.getPostsWithDetails(langId);
      let postsHtml = '';
      posts.forEach(post => {
        // Trích xuất snippet
        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = post.content;
        const snippet = tempDiv.textContent || tempDiv.innerText || "";
        const shortDesc = snippet.length > 100 ? snippet.substring(0, 100) + '...' : snippet;
        const imgUrl = `https://images.unsplash.com/photo-${1441974231531 + post.id}-c6227db76b6e?w=400`;

        postsHtml += `
        <div class="article-card" data-cat="${post.category_id}">
          <div class="article-main">
            <span class="category-tag">${post.category_name}</span>
            <div class="article-source">
              <span class="source-badge"></span>
              By <a href="profile.html?id=${post.author_id}" style="color:inherit;font-weight:600;">${post.author_name}</a> &nbsp;&middot;&nbsp; ${post.date_formatted}
            </div>
            <a href="article.html?id=${post.id}"><div class="article-title">${post.title}</div></a>
            <div class="article-desc">${shortDesc}</div>
            <div class="article-meta">
              <span>&#128075; ${post.likes}</span>
              <span>&#128172; ${post.comments}</span>
              <span class="spacer"></span>
              <span style="cursor:pointer;" onclick="alert('Đã bookmark!')">&#128278;</span>
              <span>&#8943;</span>
            </div>
          </div>
          <a href="article.html?id=${post.id}">
            <div class="article-thumb" style="background-image:url('${imgUrl}');"></div>
          </a>
        </div>
      `;
      });
      document.getElementById('articleList').innerHTML = postsHtml;

      // Init Logic
      pills = document.querySelectorAll('.category-pill');
      cards = document.querySelectorAll('.article-card');

      pills.forEach(pill => {
        pill.addEventListener('click', () => {
          pills.forEach(p => p.classList.remove('active'));
          pill.classList.add('active');
          applyFilter(pill.dataset.cat);
          const url = new URL(window.location);
          if (pill.dataset.cat === 'all') {
            url.searchParams.delete('cat');
          } else {
            url.searchParams.set('cat', pill.dataset.cat);
          }
          window.history.replaceState({}, '', url);
        });
      });

      const params = new URLSearchParams(window.location.search);
      const initialCat = params.get('cat') || 'all';
      const matchedPill = [...pills].find(p => p.dataset.cat === initialCat) || pills[0];
      pills.forEach(p => p.classList.remove('active'));
      matchedPill.classList.add('active');
      applyFilter(matchedPill.dataset.cat);
    });

    function applyFilter(cat) {
      let visibleCount = 0;
      cards.forEach(card => {
        const match = cat === 'all' || card.dataset.cat === cat;
        card.style.display = match ? 'flex' : 'none';
        if (match) visibleCount++;
      });
      emptyState.style.display = visibleCount === 0 ? 'block' : 'none';
      const activePill = [...pills].find(p => p.dataset.cat === cat);
      sectionTitle.textContent = cat === 'all'
        ? 'Bài viết mới nhất'
        : 'Bài viết thuộc danh mục: ' + (activePill ? activePill.textContent : '');
    }
  </script>

  <script src="shared.js"></script>
</body>

</html>
