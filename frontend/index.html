<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <title>Medium</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    .feed-wrapper {
      padding: 24px 32px;
    }

    .tabs {
      display: flex;
      gap: 24px;
      border-bottom: 1px solid #F2F2F2;
      margin-bottom: 8px;
    }

    .tabs a {
      padding: 12px 0;
      font-size: 15px;
      color: #6B6B6B;
      border-bottom: 2px solid transparent;
    }

    .tabs a.active {
      color: #242424;
      font-weight: 600;
      border-bottom: 2px solid #242424;
    }

    .article-card {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      padding: 28px 0;
      border-bottom: 1px solid #F2F2F2;
    }

    .article-main {
      flex: 1;
      min-width: 0;
    }

    .article-source {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: #6B6B6B;
      margin-bottom: 8px;
    }

    .source-badge {
      width: 20px;
      height: 20px;
      border-radius: 4px;
      background: linear-gradient(135deg, #7C5CE0, #4A90E2);
      display: inline-block;
    }

    .source-badge.sport {
      background: #1E90C9;
    }

    .article-title {
      font-size: 22px;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 6px;
      cursor: pointer;
    }

    .article-title:hover {
      text-decoration: underline;
    }

    .article-desc {
      font-size: 16px;
      color: #6B6B6B;
      margin-bottom: 14px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .article-meta {
      display: flex;
      align-items: center;
      gap: 20px;
      color: #6B6B6B;
      font-size: 14px;
    }

    .article-meta .meta-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .article-meta .spacer {
      flex: 1;
    }

    .article-thumb {
      width: 160px;
      height: 110px;
      border-radius: 6px;
      object-fit: cover;
      background-size: cover;
      background-position: center;
      flex-shrink: 0;
      cursor: pointer;
    }

    .because-follow {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #6B6B6B;
      padding: 20px 0 8px 0;
    }

    .author-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      color: #6B6B6B;
      margin-bottom: 10px;
    }

    .author-row .mini-avatar {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #999;
    }
  </style>
</head>

<body>

  <!-- ===== Topbar ===== -->
  <div class="topbar">
    <div class="topbar-left">
      <span class="hamburger" onclick="toggleSidebar()">&#9776;</span>
      <span class="logo">Medium</span>
      <div class="search-box">&#128269; <span>Search</span></div>
    </div>
    <div class="topbar-right">
      <button class="btn-getapp">&#9638; Get app</button>
      <span class="write-link">&#9998; Write</span>
      <div class="lang-dropdown">
        <button class="lang-btn" onclick="toggleLangMenu()">&#127760; <span class="lang-current-label">Tiếng Việt</span>
          &#9662;</button>
        <div class="lang-menu">
          <a href="#" data-lang="vi" onclick="selectLanguage('vi');return false;">Tiếng Việt</a>
          <a href="#" data-lang="en" onclick="selectLanguage('en');return false;">English</a>
        </div>
      </div>
      <button class="theme-toggle" onclick="toggleTheme()"><span class="knob">&#9728;</span></button>
      <span class="icon-btn">&#128276;</span>
      <div class="avatar">N</div>
    </div>
  </div>

  <div class="layout" id="layoutRoot">
    <!-- ===== Sidebar ===== -->
    <aside class="sidebar">
      <a href="index.html" class="active"><span class="icon">&#8962;</span> Home</a>
      <a href="category.html"><span class="icon">&#128193;</span> Category</a>
      <a href="profile.html"><span class="icon">&#128100;</span> Profile</a>
      <!-- <a href="#"><span class="icon">&#128221;</span> Stories</a>
    <a href="#"><span class="icon">&#128202;</span> Stats</a> -->
      <hr>
      <a href="#"><span class="icon">&#128101;</span> Following</a>
      <div class="follow-box">
        Find writers and publications to follow.
        <br><span class="see-suggestions">See suggestions</span>
      </div>
    </aside>

    <!-- ===== Main feed ===== -->
    <main class="feed-wrapper">
      <div class="tabs">
        <a href="#" class="active">For you</a>
        <a href="#">Featured</a>
      </div>

      <div id="feed-articles">
        <!-- Articles will be rendered here by JS -->
      </div>
    </main>

    <!-- ===== Right rail ===== -->
    <aside class="right-rail">
      <h3>Staff Picks</h3>
      <div id="staff-picks-container">
        <!-- Rendered by JS -->
      </div>
      <div class="see-full-list">See the full list</div>

      <div class="recommended-topics">
        <h3>Recommended topics</h3>
        <span class="topic-pill">Programming +</span>
      </div>
    </aside>
  </div>

  <script src="shared.js"></script>
  <script src="js/mockData.js"></script>
  <script>
    function toggleSidebar() {
      document.getElementById('layoutRoot').classList.toggle('sidebar-collapsed');
    }

    // --- Render logic ---
    document.addEventListener('DOMContentLoaded', () => {
      // 1. Setup Header based on Login status
      const currentUser = db.getCurrentUser();
      if (!currentUser) {
        // Đổi Giao diện nếu chưa đăng nhập
        const topbarRight = document.querySelector('.topbar-right');
        topbarRight.innerHTML = `
        <a href="login.html" style="margin-right:15px; color:#6B6B6B; text-decoration:none;">Sign In</a>
        <a href="register.html" style="background:#242424; color:#fff; padding:8px 16px; border-radius:20px; text-decoration:none;">Get Started</a>
      `;
      }

      // 2. Render Posts
      const langId = localStorage.getItem('current_language_id') || '1';
      const posts = db.getPostsWithDetails(langId);

      const container = document.getElementById('feed-articles');
      let html = '';

      posts.forEach(post => {
        // Trích xuất 1 đoạn ngắn text từ content html
        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = post.content;
        const snippet = tempDiv.textContent || tempDiv.innerText || "";
        const shortDesc = snippet.length > 100 ? snippet.substring(0, 100) + '...' : snippet;

        // Random 1 cái ảnh đại diện cho sinh động (thực tế lấy từ csdl)
        const randomImage = `https://images.unsplash.com/photo-${1441974231531 + post.id}-c6227db76b6e?w=400`;

        html += `
        <div class="article-card">
          <div class="article-main">
            <div class="article-source">
              <span class="source-badge"></span>
              In ${post.category_name} by <a href="profile.html?id=${post.author_id}" style="color:inherit; font-weight:600;">${post.author_name}</a> &nbsp;&middot;&nbsp; ${post.date_formatted}
            </div>
            <a href="article.html?id=${post.id}" style="text-decoration:none; color:inherit;">
              <div class="article-title">${post.title}</div>
            </a>
            <div class="article-desc">${shortDesc}</div>
            <div class="article-meta">
              <span class="meta-item">&#128075; ${post.likes}</span>
              <span class="meta-item">&#128172; ${post.comments}</span>
              <span class="spacer"></span>
              <span class="meta-item" style="cursor:pointer;" onclick="alert('Đã bookmark!')">&#128278;</span>
              <span class="meta-item">&#8943;</span>
            </div>
          </div>
          <a href="article.html?id=${post.id}">
            <div class="article-thumb" style="background-image:url('${randomImage}');"></div>
          </a>
        </div>
      `;
      });
      container.innerHTML = html;

      // 3. Render Staff Picks (Right Rail)
      const staffPicksContainer = document.getElementById('staff-picks-container');
      let picksHtml = '';
      const sortedPosts = [...posts].sort((a, b) => b.likes - a.likes).slice(0, 3);
      sortedPosts.forEach(post => {
        picksHtml += `
        <div class="pick">
          <div class="pick-source"><span class="badge" style="background:#7C5CE0;"></span> In ${post.category_name} by ${post.author_name}</div>
          <h4 onclick="location.href='article.html?id=${post.id}'" style="cursor:pointer">${post.title}</h4>
          <div class="pick-date">&#10022; ${post.date_formatted}</div>
        </div>
      `;
      });
      staffPicksContainer.innerHTML = picksHtml;
    });
  </script>
</body>

</html>
