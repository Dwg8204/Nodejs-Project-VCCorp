<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Đăng ký – Medium</title>
<link rel="stylesheet" href="shared.css">
<style>
  .auth-topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 32px;
    border-bottom: 1px solid var(--border);
  }
  .auth-wrapper {
    max-width: 380px;
    margin: 60px auto;
    padding: 0 20px;
  }
  .auth-wrapper h1 {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 32px;
    font-weight: 400;
    text-align: center;
    margin-bottom: 32px;
  }
  .social-btn {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    border: 1px solid var(--border-strong);
    border-radius: 24px;
    padding: 12px;
    font-size: 15px;
    background: var(--card-bg);
    color: var(--text);
    cursor: pointer;
    margin-bottom: 12px;
  }
  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    color: var(--text-muted);
    font-size: 13px;
    margin: 24px 0;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }
  .btn-primary-block {
    width: 100%;
    background: var(--text);
    color: var(--bg);
    border: none;
    border-radius: 24px;
    padding: 12px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  .auth-footer-text {
    text-align: center;
    font-size: 14px;
    color: var(--text-muted);
    margin-top: 24px;
  }
  .auth-footer-text a { color: var(--accent); font-weight: 600; }
  .terms-text {
    font-size: 12px;
    color: var(--text-muted);
    text-align: center;
    margin-top: 16px;
    line-height: 1.5;
  }
</style>
</head>
<body>

<div class="auth-topbar">
  <a href="index.html" class="logo">Medium</a>
  <div style="display:flex; align-items:center; gap:16px;">
    <button class="theme-toggle" onclick="toggleTheme()"><span class="knob">&#9728;</span></button>
    <span style="font-size:14px; color:var(--text-muted);">Đã có tài khoản?</span>
    <a href="login.html" class="btn" style="border:1px solid var(--text); color:var(--text); padding:8px 18px;">Đăng nhập</a>
  </div>
</div>

<div class="auth-wrapper">
  <h1>Tạo tài khoản</h1>

  <button class="social-btn">&#128421; Đăng ký với Google</button>
  <button class="social-btn">&#61805; Đăng ký với Facebook</button>

  <div class="divider">hoặc</div>

  <form onsubmit="return false;">
    <div class="form-group">
      <label>Họ và tên</label>
      <input type="text" class="form-control" placeholder="Nguyễn Văn A" required>
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" class="form-control" placeholder="you@example.com" required>
    </div>
    <div class="form-group">
      <label>Mật khẩu</label>
      <input type="password" class="form-control" placeholder="Tối thiểu 8 ký tự" required>
    </div>
    <button type="submit" class="btn-primary-block" onclick="location.href='index.html'">Đăng ký</button>
  </form>

  <div class="terms-text">
    Bằng việc đăng ký, bạn đồng ý với Điều khoản dịch vụ và Chính sách bảo mật của chúng tôi.
  </div>

  <div class="auth-footer-text">
    Đã có tài khoản? <a href="login.html">Đăng nhập</a>
  </div>
</div>

<script src="shared.js"></script>
</body>
</html>
